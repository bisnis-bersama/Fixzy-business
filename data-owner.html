<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Owner | FIXZY BUSINESS</title>
<style>
:root{--yellow:#ffc107;--black:#111;--bg:#f3f4f6;--white:#fff;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.header{background:#111;color:#fff;padding:16px 15px 66px;position:relative;z-index:5;border-radius:0 0 30px 30px}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#222}
.brand h1{font-size:18px;margin:0;color:#ffc107}.brand small{color:#ccc}
.container{max-width:900px;margin:-42px auto 0;padding:0 15px 90px;position:relative;z-index:6}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
h2{font-size:19px;margin:0 0 6px}h3{font-size:16px;margin:0 0 8px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-size:16px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee;font-size:11px;font-weight:700}
.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;padding:10px 9px;border:0;border-radius:11px;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:700;cursor:pointer;font-size:13px;line-height:1.25;white-space:normal}
.btn.yellow{background:var(--yellow);color:#111}.btn.light{background:#eee;color:#111}.btn.green{background:#15803d;color:#fff}.btn.red{background:#b91c1c;color:#fff}.owner-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.owner-actions button{min-width:0}.owner-actions [data-action="limitKurang"]{grid-column:auto}.action-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45;background:#f8fafc;padding:10px;border-radius:10px}.owner-detail-action{margin-top:10px}.owner-detail-action .btn{width:100%;min-height:42px}.notice{padding:10px;border-radius:10px;margin:10px 0;font-size:12px;display:none}.notice.okay{display:block;background:#dcfce7;color:#166534}.notice.error{display:block;background:#fee2e2;color:#991b1b}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #d1d5db;border-radius:12px}
.loading{padding:20px;text-align:center;color:var(--muted)}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.detail.show{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:#f8f8f8;border-radius:10px;padding:10px}.field small{display:block;color:var(--muted);font-size:10px}.field b{display:block;margin-top:4px;font-size:13px;word-break:break-word}
.photo{max-width:180px;border-radius:10px;border:1px solid var(--border);display:block;margin-top:8px}
.back{display:block;text-align:center;color:#555;text-decoration:none;margin-top:15px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid var(--yellow);display:flex;justify-content:center;z-index:10}
.bottom a{max-width:180px;flex:1;padding:11px 3px 10px;text-align:center;text-decoration:none;color:#bbb;font-size:11px;font-weight:700}.bottom a.active{color:var(--yellow);font-weight:800}
.bottom .ico{display:block;font-size:19px;line-height:20px;margin-bottom:2px}
@media(max-width:520px){.container{padding:12px 12px 88px}.detail-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <img class="logo" src="logofixzy.png" onerror="this.style.display='none'">
      <div><h1>FIXZY BUSINESS</h1><small>Data Owner</small></div>
    </div>
    <a href="index-superadmin.html" style="color:#fff;text-decoration:none;font-size:24px">⌂</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2>Data Owner</h2>
    <p class="note">Daftar Owner yang terdaftar di sistem FIXZY BUSINESS. Data dibaca langsung dari Firebase.</p>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:12px">
      <h3 style="margin:0">Owner Terdaftar</h3>
      <span id="jumlah" class="badge">0 Owner</span>
    </div>
    <div id="status" class="loading">Memuat data Owner...</div>
    <div id="list" class="list"></div>
  </section>

  <a class="back" href="index-superadmin.html">← Kembali ke Dashboard Superadmin</a>
</main>

<nav class="bottom">
  <a href="index-superadmin.html"><span class="ico">⌂</span>Beranda</a>
  <a href="admin-topup-fixzy-business.html"><span class="ico">💰</span>Top Up</a>
  <a class="active" href="data-owner.html"><span class="ico">👥</span>Owner</a>
  <a href="approval-limit-fixzy-business-superadmin.html"><span class="ico">💳</span>Limit</a>
  <a href="pengaturan.html"><span class="ico">⚙</span>Profil</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, query, where, doc, getDoc, runTransaction, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");
const jumlahEl = document.getElementById("jumlah");
let currentAdmin = null;
const rupiah = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function formatDate(v){
  if(!v) return "-";
  try{
    if(v.toDate) return v.toDate().toLocaleString("id-ID");
    if(v.seconds) return new Date(v.seconds*1000).toLocaleString("id-ID");
    return new Date(v).toLocaleString("id-ID");
  }catch{return "-"}
}

function statusBadge(v){
  const s=String(v||"").toLowerCase();
  if(s.includes("aktif") || s==="active") return '<span class="badge ok">AKTIF</span>';
  if(s.includes("tolak") || s.includes("blok")) return '<span class="badge bad">'+esc(v)+'</span>';
  return '<span class="badge wait">'+esc(v||"MENUNGGU")+'</span>';
}

async function renderOwner(id,d){
  // Ambil saldo dan limit yang sudah tersimpan untuk Owner ini.
  const [walletSnap,limitSnap]=await Promise.all([
    getDoc(doc(db,"wallets",id)),
    getDoc(doc(db,"limits",id))
  ]);
  const wallet=walletSnap.exists()?walletSnap.data():{};
  const limit=limitSnap.exists()?limitSnap.data():{};
  const saldoSaatIni=Number(wallet.saldoPribadi)||0;
  const limitDisetujui=Number(limit.limitDisetujui)||0;
  const limitTerpakai=Number(limit.limitTerpakai)||0;
  const limitTersedia=Number.isFinite(Number(limit.limitTersedia))?Number(limit.limitTersedia):Math.max(0,limitDisetujui-limitTerpakai);
  const ktp=d.dataKtp||{};
  const nama=d.namaLengkap||d.nama||ktp.nama||d.name||"Tanpa Nama";
  const usaha=d.namaUsaha||d.business||d.usaha||"-";
  const wa=d.whatsapp||d.phone||ktp.whatsapp||"-";
  const email=d.email||"-";
  const status=d.status||"AKTIF";

  const el=document.createElement("div");
  el.className="item";
  el.innerHTML=`
    <div class="row">
      <div>
        <div class="name">${esc(nama)}</div>
        <div class="sub">${esc(usaha)} · ${esc(wa)}</div>
      </div>
      <div>${statusBadge(status)}</div>
    </div>
    <div class="detail-grid" style="margin-top:12px">
      <div class="field"><small>Saldo Pribadi Saat Ini</small><b style="color:#15803d">${esc(rupiah(saldoSaatIni))}</b></div>
      <div class="field"><small>Limit Disetujui</small><b style="color:#111">${esc(rupiah(limitDisetujui))}</b></div>
      <div class="field"><small>Limit Terpakai</small><b style="color:#b91c1c">${esc(rupiah(limitTerpakai))}</b></div>
      <div class="field"><small>Limit Tersedia</small><b style="color:#15803d">${esc(rupiah(limitTersedia))}</b></div>
    </div>
    <div class="owner-actions">
      <button class="btn green" data-action="saldoTambah" data-owner="${esc(id)}" data-name="${esc(nama)}">＋ Tambah Saldo</button>
      <button class="btn red" data-action="saldoKurang" data-owner="${esc(id)}" data-name="${esc(nama)}">− Kurangi Saldo</button>
      <button class="btn green" data-action="limitTambah" data-owner="${esc(id)}" data-name="${esc(nama)}">＋ Tambah Limit</button>
      <button class="btn red" data-action="limitKurang" data-owner="${esc(id)}" data-name="${esc(nama)}">− Kurangi Limit</button>
    </div>
    <div class="action-note">Perubahan saldo dan limit dicatat dengan UID Superadmin serta waktu transaksi.</div>
    <div class="owner-detail-action">
      <button class="btn yellow" data-detail="${esc(id)}">Lihat Detail</button>
    </div>
    <div class="detail" id="detail-${esc(id)}">
      <div class="detail-grid">
        <div class="field"><small>Owner UID</small><b>${esc(d.ownerUid||id)}</b></div>
        <div class="field"><small>Email</small><b>${esc(email)}</b></div>
        <div class="field"><small>Nama Usaha</small><b>${esc(usaha)}</b></div>
        <div class="field"><small>WhatsApp</small><b>${esc(wa)}</b></div>
        <div class="field"><small>Tanggal Daftar</small><b>${esc(formatDate(d.createdAt||d.tanggalDaftar))}</b></div>
        <div class="field"><small>Status</small><b>${esc(status)}</b></div>
      </div>
      <h3 style="margin-top:14px">Data KTP</h3>
      <div class="detail-grid">
        <div class="field"><small>Nama Lengkap</small><b>${esc(ktp.nama||"-")}</b></div>
        <div class="field"><small>NIK</small><b>${esc(ktp.nik||"-")}</b></div>
        <div class="field"><small>Alamat</small><b>${esc(ktp.alamat||"-")}</b></div>
        <div class="field"><small>RT / RW</small><b>${esc(ktp.rt||"-")} / ${esc(ktp.rw||"-")}</b></div>
        <div class="field"><small>Kelurahan/Desa</small><b>${esc(ktp.desa||ktp.kelurahan||"-")}</b></div>
        <div class="field"><small>Kecamatan</small><b>${esc(ktp.kecamatan||"-")}</b></div>
        <div class="field"><small>Kabupaten/Kota</small><b>${esc(ktp.kabupaten||"-")}</b></div>
        <div class="field"><small>Provinsi</small><b>${esc(ktp.provinsi||"-")}</b></div>
      </div>
      ${ktp.fotoKtpUrl ? `<div style="margin-top:12px"><small style="color:#6b7280;display:block;margin-bottom:6px">Foto KTP</small><a class="btn light" href="${esc(ktp.fotoKtpUrl)}" target="_blank" rel="noopener">📷 Lihat Foto KTP</a></div>` : ""}
    </div>`;
  listEl.appendChild(el);

  el.querySelector("[data-detail]").addEventListener("click",()=>{
    const detail=el.querySelector(".detail");
    const btn=el.querySelector("[data-detail]");
    detail.classList.toggle("show");
    btn.textContent=detail.classList.contains("show")?"Tutup Detail":"Lihat Detail";
  });
}

async function verifySuperadmin(user){
  try{const token=await user.getIdTokenResult(true);if(token.claims?.role==="superadmin")return true;}catch(e){}
  const snap=await getDoc(doc(db,"users",user.uid));
  return snap.exists() && String(snap.data().role||"").toLowerCase()==="superadmin";
}

async function loadOwners(){
  statusEl.className="loading";statusEl.style.display="block";statusEl.textContent="Memuat data Owner...";
  const q=query(collection(db,"users"),where("role","==","owner"));
  const snap=await getDocs(q);
  listEl.innerHTML="";jumlahEl.textContent=`${snap.size} Owner`;
  if(snap.empty){statusEl.className="empty";statusEl.textContent="Belum ada Owner terdaftar.";return;}
  statusEl.style.display="none";
  await Promise.all(snap.docs.map(d=>renderOwner(d.id,d.data())));
}

async function adjustOwner(action,ownerUid,ownerName){
  if(!currentAdmin)throw new Error("Sesi Superadmin tidak ditemukan.");
  const isSaldo=action.startsWith("saldo");
  const isTambah=action.endsWith("Tambah");
  const label=(isSaldo?"Saldo":"Limit");
  const nominalRaw=prompt(`${isTambah?"TAMBAH":"KURANGI"} ${label} untuk ${ownerName}
Masukkan nominal (Rupiah, angka saja):`);
  if(nominalRaw===null)return;
  const nominal=Number(String(nominalRaw).replace(/[.\s]/g,"").replace(/,/g,"."));
  if(!Number.isFinite(nominal)||nominal<=0||!Number.isSafeInteger(nominal))throw new Error("Nominal harus berupa bilangan bulat Rupiah lebih dari 0.");
  const alasan=prompt("Catatan/alasan perubahan (wajib):");
  if(alasan===null)return;
  if(!alasan.trim())throw new Error("Catatan perubahan wajib diisi.");
  const verb=isTambah?"menambahkan":"mengurangi";
  if(!confirm(`Konfirmasi ${verb} ${label.toLowerCase()} ${rupiah(nominal)} untuk ${ownerName}?

Catatan: ${alasan.trim()}`))return;

  const walletRef=doc(db,"wallets",ownerUid);
  const limitRef=doc(db,"limits",ownerUid);
  const logRef=doc(collection(db,isSaldo?"walletTransactions":"limitTransactions"));
  await runTransaction(db,async tx=>{
    if(isSaldo){
      const ws=await tx.get(walletRef);const old=ws.exists()?ws.data():{};
      const before=Number(old.saldoPribadi)||0;
      const after=before+(isTambah?nominal:-nominal);
      if(after<0)throw new Error(`Saldo tidak cukup. Saldo saat ini ${rupiah(before)}.`);
      tx.set(walletRef,{ownerUid,saldoPribadi:after,status:old.status||"AKTIF",updatedAt:serverTimestamp(),...(ws.exists()?{}:{createdAt:serverTimestamp()})},{merge:true});
      tx.set(logRef,{ownerUid,type:"ADMIN_ADJUSTMENT",action:isTambah?"TAMBAH_SALDO":"KURANGI_SALDO",nominal,amount:nominal,saldoSebelum:before,saldoSesudah:after,status:"DISETUJUI",catatan:alasan.trim(),processedBy:currentAdmin.uid,createdAt:serverTimestamp(),verifiedAt:serverTimestamp()});
    }else{
      const ls=await tx.get(limitRef);const old=ls.exists()?ls.data():{};
      const approved=Number(old.limitDisetujui)||0;const used=Number(old.limitTerpakai)||0;
      const after=approved+(isTambah?nominal:-nominal);
      if(after<used)throw new Error(`Limit tidak bisa dikurangi di bawah limit terpakai ${rupiah(used)}. Limit disetujui saat ini ${rupiah(approved)}.`);
      if(after<0)throw new Error("Limit tidak boleh negatif.");
      const available=after-used;
      tx.set(limitRef,{ownerUid,limitDisetujui:after,limitTerpakai:used,limitTersedia:available,status:"DISETUJUI",updatedAt:serverTimestamp()},{merge:true});
      tx.set(logRef,{ownerUid,type:"ADMIN_ADJUSTMENT",action:isTambah?"TAMBAH_LIMIT":"KURANGI_LIMIT",nominal,limitSebelum:approved,limitSesudah:after,limitTerpakai:used,limitTersediaSesudah:available,status:"DISETUJUI",catatan:alasan.trim(),processedBy:currentAdmin.uid,createdAt:serverTimestamp(),processedAt:serverTimestamp()});
    }
  });
  alert(`${label} berhasil ${isTambah?"ditambahkan":"dikurangi"} sebesar ${rupiah(nominal)} untuk ${ownerName}.`);
  await loadOwners();
}

listEl.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-action]");if(!b)return;
  const buttons=b.closest(".item").querySelectorAll("button");buttons.forEach(x=>x.disabled=true);
  const oldText=b.textContent;b.textContent="Memproses...";
  try{await adjustOwner(b.dataset.action,b.dataset.owner,b.dataset.name);}
  catch(err){console.error(err);alert("Gagal mengubah data: "+(err.message||err)+"\nPastikan Firestore Rules mengizinkan Superadmin mengubah wallets, limits, walletTransactions, dan limitTransactions.");}
  finally{buttons.forEach(x=>x.disabled=false);b.textContent=oldText;}
});

onAuthStateChanged(auth, async user=>{
  if(!user){statusEl.className="empty";statusEl.textContent="Silakan login sebagai Superadmin.";return;}
  try{
    if(!(await verifySuperadmin(user))){statusEl.className="empty";statusEl.textContent="Akses ditolak. Halaman ini khusus Superadmin.";return;}
    currentAdmin=user;await loadOwners();
  }catch(err){console.error(err);statusEl.className="empty";statusEl.innerHTML="Gagal membaca data Owner.<br><small>"+esc(err.message||err)+"</small>";}
});
</script>
</body>
</html>
