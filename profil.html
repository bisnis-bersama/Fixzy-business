<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Owner | FIXZY BUSINESS</title><style>
:root{--yellow:#ffc107;--black:#111;--bg:#f3f4f6;--white:#fff;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#222}
.brand h1{font-size:18px;margin:0;color:var(--yellow)}.brand small{color:#bbb}
.container{max-width:900px;margin:auto;padding:16px 16px 90px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.hero{background:#111;color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.hero small{color:#ccc}.hero strong{display:block;font-size:28px;margin-top:8px;color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8f8f8;border-radius:13px;padding:14px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{display:block;margin-top:7px;font-size:18px}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:700;cursor:pointer}.btn.yellow{background:var(--yellow);color:#111}.btn.light{background:#eee;color:#111}.btn.red{background:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:15px}
label{font-size:13px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:center;z-index:10}.bottom a{max-width:180px;flex:1;padding:12px 4px;text-align:center;text-decoration:none;color:#aaa;font-size:11px}.bottom a.active{color:var(--yellow);font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.5}.back{display:block;text-align:center;color:#555;text-decoration:none;margin-top:15px}
.list{display:flex;flex-direction:column;gap:10px}.item{padding:13px;border:1px solid var(--border);border-radius:12px;background:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr 1fr}.container{padding:12px 12px 88px}}
</style></head><body>
<header class="header"><div class="header-inner"><div class="brand"><img class="logo" src="logofixzy.png" onerror="this.style.display='none'"><div><h1>FIXZY BUSINESS</h1><small>Profil Owner</small></div></div><a href="index.html" style="color:#fff;text-decoration:none">⌂</a></div></header>
<main class="container">
<section class="card">
<h2>Profil Owner</h2>
<div id="msg" class="note" style="margin-bottom:10px">Memuat profil...</div>
<label>Nama</label>
<input id="nama" placeholder="Nama Owner">
<label>Nama Usaha</label>
<input id="namaUsaha" placeholder="Nama Usaha">
<label>WhatsApp</label>
<input id="whatsapp" placeholder="08xxxxxxxxxx" inputmode="tel">
<label>Email</label>
<input id="email" placeholder="email" type="email" readonly>
<button id="saveBtn" class="btn yellow" type="button">Simpan Profil</button>
</section>
<section class="card"><a class="btn red" href="index.html">Keluar</a></section>
</main>
<nav class="bottom">
<a class="" href="index.html">Beranda</a>
<a class="" href="produk.html">Belanja</a>
<a class="" href="tagihan.html">Tagihan</a>
<a class="" href="riwayat.html">Riwayat</a>
<a class="active" href="profil.html">Profil</a>
</nav><script type="module">const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const msg=document.getElementById("msg");
const nama=document.getElementById("nama");
const namaUsaha=document.getElementById("namaUsaha");
const whatsapp=document.getElementById("whatsapp");
const email=document.getElementById("email");
const saveBtn=document.getElementById("saveBtn");

function show(text,type=""){
  msg.textContent=text;
  msg.className="note"+(type?" "+type:"");
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  email.value=user.email||"";

  try{
    const ref=doc(db,"users",user.uid);
    const snap=await getDoc(ref);
    const data=snap.exists()?snap.data():{};

    nama.value=data.nama||data.name||data.displayName||"";
    namaUsaha.value=data.namaUsaha||data.businessName||data.namaBisnis||"";
    whatsapp.value=data.whatsapp||data.phone||data.noWhatsApp||"";

    show("Profil berhasil dimuat.");
  }catch(err){
    console.error(err);
    show("Profil gagal dimuat: "+(err.message||err));
  }
});

saveBtn.addEventListener("click",async()=>{
  const user=auth.currentUser;
  if(!user)return;

  const n=nama.value.trim();
  const usaha=namaUsaha.value.trim();
  const wa=whatsapp.value.trim();

  if(!n){
    show("Nama Owner wajib diisi.");
    nama.focus();
    return;
  }

  saveBtn.disabled=true;
  saveBtn.textContent="Menyimpan...";

  try{
    const ref=doc(db,"users",user.uid);
    await setDoc(ref,{
      nama:n,
      namaUsaha:usaha,
      whatsapp:wa,
      updatedAt:serverTimestamp()
    },{merge:true});

    show("Profil berhasil disimpan.","ok");
  }catch(err){
    console.error(err);
    show("Gagal menyimpan profil: "+(err.message||err));
  }finally{
    saveBtn.disabled=false;
    saveBtn.textContent="Simpan Profil";
  }
});
</script></body></html>
