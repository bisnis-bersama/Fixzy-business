<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIXZY BUSINESS — Owner</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:84px}
.header{background:#111;color:#fff;padding:24px 28px 74px;border-radius:0 0 32px 32px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand-left{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:62px;height:62px;border-radius:16px;background:#fff;overflow:hidden;flex:0 0 62px}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;color:#FFC107;font-size:22px;font-weight:900}
.brand p{margin:4px 0 0;color:#ddd;font-size:14px}
.logout{border:1px solid #3a3a3a;background:#191919;color:#ddd;border-radius:15px;padding:12px 17px;font-size:15px}
.content{padding:0 26px;margin-top:-38px}
.balance{background:#fff;border-radius:28px;padding:25px 28px;box-shadow:0 10px 28px rgba(0,0,0,.08)}
.balance-head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.label{font-size:14px;font-weight:800;color:#667085;letter-spacing:.5px}
.amount{font-size:42px;font-weight:900;margin-top:3px}
.topup{border:0;background:#FFC107;color:#111;font-weight:900;border-radius:15px;padding:15px 19px;font-size:17px}
.line{height:1px;background:#e5e7eb;margin:20px 0}
.stats{display:grid;grid-template-columns:1fr 1fr}
.stat{padding-right:20px}.stat+ .stat{border-left:1px solid #e5e7eb;padding-left:25px}
.stat small{display:block;color:#667085;font-size:14px}.stat b{display:block;font-size:25px;margin-top:7px}
.title{display:flex;justify-content:space-between;align-items:center;margin:36px 5px 14px}
.title h2{margin:0;font-size:21px}.title span{color:#667085;font-size:13px}
.menu{background:#fff;border:1px solid #e5e7eb;border-radius:28px;padding:22px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px 8px;box-shadow:0 8px 24px rgba(0,0,0,.045)}
.menu button{border:0;background:transparent;color:#111827;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 3px;border-radius:15px;cursor:pointer}
.menu button:hover{background:#f8fafc}
.icon{font-size:35px;line-height:1;height:40px;display:grid;place-items:center}
.menu span{font-size:14px;font-weight:800;text-align:center}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);height:76px;background:#111;border-top:1px solid #292929;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav{border:0;background:transparent;color:#FFC107;font-size:11px;font-weight:800}
.nav i{display:block;font-style:normal;font-size:25px;margin-bottom:2px}
.loading{position:fixed;inset:0;background:#f4f5f7;display:grid;place-items:center;z-index:50;font-weight:800}
@media(max-width:600px){
.header{padding:23px 16px 72px;border-radius:0 0 30px 30px}
.logo{width:62px;height:62px;flex-basis:62px}
.brand h1{font-size:21px}.brand p{font-size:14px}
.logout{padding:11px 15px}
.content{padding:0 25px;margin-top:-37px}
.balance{padding:27px 29px;border-radius:28px}
.amount{font-size:40px}
.topup{font-size:16px;padding:14px 17px}
.stat b{font-size:24px}
.title{margin-top:36px}
.menu{grid-template-columns:repeat(4,1fr);padding:21px 9px;gap:24px 4px;border-radius:28px}
.icon{font-size:34px}
.menu span{font-size:13px}
}
@media(max-width:370px){
.content{padding:0 16px}.balance{padding:22px 20px}
.amount{font-size:34px}.menu span{font-size:12px}
}
</style>
</head>
<body>
<div class="loading" id="loading">Memuat FIXZY BUSINESS...</div>
<div class="app">
<header class="header">
 <div class="brand">
  <div class="brand-left">
   <div class="logo"><img src="logofixzy.png" alt="FIXZY"></div>
   <div><h1>FIXZY BUSINESS</h1><p id="businessName">Owner</p></div>
  </div>
  <button class="logout" id="logout">Keluar</button>
 </div>
</header>
<main class="content">
<section class="balance">
 <div class="balance-head">
  <div><div class="label">SALDO PRIBADI</div><div class="amount" id="saldo">Rp0</div></div>
  <button class="topup" onclick="location.href='topup.html'">+ Top Up</button>
 </div>
 <div class="line"></div>
 <div class="stats">
  <div class="stat"><small>Limit Tersedia</small><b id="limit">Rp0</b></div>
  <div class="stat"><small>Total Tagihan</small><b id="tagihan">Rp0</b></div>
 </div>
</section>
<div class="title"><h2>Menu Utama</h2><span>FIXZY BUSINESS</span></div>
<section class="menu">
 <button onclick="location.href='produk.html'"><div class="icon">🛒</div><span>Belanja</span></button>
 <button onclick="location.href='topup.html'"><div class="icon">💰</div><span>Top Up</span></button>
 <button onclick="location.href='limit.html'"><div class="icon">💳</div><span>Limit</span></button>
 <button onclick="location.href='tagihan.html'"><div class="icon">🧾</div><span>Tagihan</span></button>
 <button onclick="location.href='riwayat.html'"><div class="icon">↔️</div><span>Riwayat</span></button>
 <button onclick="location.href='profil.html'"><div class="icon">👤</div><span>Profil</span></button>
</section>
</main>
<nav class="bottom">
 <button class="nav" onclick="location.href='index.html'"><i>⌂</i>Beranda</button>
 <button class="nav" onclick="location.href='produk.html'"><i>🛒</i>Belanja</button>
 <button class="nav" onclick="location.href='tagihan.html'"><i>🧾</i>Tagihan</button>
 <button class="nav" onclick="location.href='riwayat.html'"><i>↔️</i>Riwayat</button>
 <button class="nav" onclick="location.href='profil.html'"><i>👤</i>Profil</button>
</nav>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
document.getElementById("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
 if(!user){location.href="index.html";return}
 try{
  const us=await getDoc(doc(db,"users",user.uid)); const p=us.exists()?us.data():{};
  if(p.role!=="owner"||p.ownerUid!==user.uid){location.href="index-superadmin-baru.html";return}
  document.getElementById("businessName").textContent=p.namaUsaha||p.nama||"Owner";
  const ws=await getDoc(doc(db,"wallets",user.uid));
  const ls=await getDoc(doc(db,"limits",user.uid));
  document.getElementById("saldo").textContent=rupiah(ws.exists()?(ws.data().saldoPribadi||0):0);
  document.getElementById("limit").textContent=rupiah(ls.exists()?(ls.data().limitTersedia||0):0);
  try{
   const q=query(collection(db,"invoices"),where("ownerUid","==",user.uid));
   const snap=await getDocs(q); let total=0;
   snap.forEach(d=>{const x=d.data(); total+=Number(x.sisaTagihan??x.sisa??x.total??0)||0});
   document.getElementById("tagihan").textContent=rupiah(total);
  }catch(e){document.getElementById("tagihan").textContent="Rp0"}
 }catch(e){document.getElementById("businessName").textContent="Gagal memuat data";console.error(e)}
 document.getElementById("loading").remove();
});
</script>
</body></html>
