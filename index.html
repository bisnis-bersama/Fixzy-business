button,input{font:inherit}
.app{width:100%;max-width:1180px;min-height:100vh;margin:auto;padding-bottom:82px}
.top{background:#111;color:#fff;padding:18px 18px 82px;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--yellow);display:grid;place-items:center;flex:0 0 48px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.brand h1{font-size:17px;margin:0;font-weight:900;color:var(--yellow)}
.brand small{display:block;color:#d1d5db;margin-top:3px;font-size:12px}
.logout{border:1px solid #333;background:#1b1b1b;color:#fff;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:800}
.content{padding:0 clamp(14px,3vw,28px);margin-top:-60px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.08)}
.label{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}
.amount{font-size:26px;font-weight:900}
.balance-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.topup{border:0;border-radius:12px;background:#111;color:var(--yellow);padding:11px 14px;font-weight:900;font-size:12px}
.divider{height:1px;background:var(--line);margin:16px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f8f8f8;border:1px solid #ededed;border-radius:15px;padding:13px}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:700}
.stat b{font-size:15px}
.section{margin-top:18px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}
.section-title h2{font-size:15px;margin:0;font-weight:900}
.section-title span{color:var(--muted);font-size:10px;font-weight:800}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 0}
.menu-btn{min-height:78px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--text)}
.menu-btn:active{background:#fff}
.icon{width:42px;height:42px;border-radius:13px;background:#111;color:var(--yellow);display:grid;place-items:center;font-size:20px}
.menu-btn span{font-size:12px;font-weight:900;text-align:center}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav{border:0;background:transparent;color:var(--yellow);font-size:10px;font-weight:800}
.nav i{display:block;font-style:normal;font-size:21px;line-height:22px;margin-bottom:3px}

/* Halaman promosi: carousel landscape 16:9 */
.landing{padding:0 14px 24px}
.landing-brand{background:#111;margin:0 -14px 18px;padding:14px 14px;border-radius:0;color:#fff}
.landing-subtitle{color:#d1d5db}
.landing-inner{max-width:1000px;margin:auto}
.landing-brand{display:flex;align-items:center;gap:12px;margin:0 0 16px;min-width:0}
.landing-logo{width:50px;height:50px;border-radius:13px;background:#111;border:1px solid var(--yellow);overflow:hidden;flex:0 0 50px}
.landing-logo img{width:100%;height:100%;object-fit:contain;display:block}
.landing-title{font-size:clamp(20px,3vw,30px);font-weight:900;color:var(--yellow)}
.landing-subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.promo-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 10px}
.promo-heading h2{font-size:17px;margin:0;font-weight:900}
.promo-heading span{font-size:11px;color:var(--muted);font-weight:800}
.carousel{position:relative;overflow:hidden;border-radius:22px;background:#111;box-shadow:0 12px 30px rgba(0,0,0,.16);isolation:isolate}
.slides{display:flex;width:100%;transition:transform .65s cubic-bezier(.22,.75,.25,1);will-change:transform}
.slide{width:100%;min-width:100%;flex:0 0 100%;}
.slide img{object-fit:cover;object-position:center;max-width:100%}
.slide{position:relative;flex:0 0 100%;aspect-ratio:16/9;min-height:0;background:#111;overflow:hidden}
.slide img{width:100%;height:100%;position:absolute;inset:0;object-fit:contain;object-position:center;display:block;background:#111}
.slide:after{content:none}
.slide-copy{position:absolute;z-index:2;left:clamp(16px,4vw,44px);top:50%;transform:translateY(-50%);width:min(56%,530px);color:#fff;background:rgba(8,8,8,.88);padding:clamp(10px,2vw,20px);border:1px solid rgba(255,193,7,.24);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.slide-kicker{color:var(--yellow);font-size:clamp(9px,1.2vw,13px);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.slide-copy h3{font-size:clamp(19px,4vw,43px);line-height:1.04;margin:8px 0 10px;font-weight:900}
.slide-copy p{font-size:clamp(10px,1.6vw,16px);line-height:1.45;color:#f3f4f6;margin:0;max-width:440px}
.slide-cta{display:inline-flex;margin-top:14px;padding:10px 15px;border-radius:999px;background:var(--yellow);color:#111;text-decoration:none;font-weight:900;font-size:clamp(10px,1.3vw,13px)}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:38px;height:38px;border:1px solid #ffffff70;border-radius:50%;background:#111b;color:#fff;font-size:24px;display:grid;place-items:center;cursor:pointer}
.carousel-arrow.prev{left:10px}.carousel-arrow.next{right:10px}
.carousel-dots{display:flex;justify-content:center;gap:8px;padding:12px 0 0}
.carousel-dot{width:9px;height:9px;border:0;border-radius:50%;background:#c6c8cc;padding:0;cursor:pointer}
.carousel-dot.active{background:var(--yellow);width:24px;border-radius:9px}
.promo-caption{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:11px}
.promo-caption strong{color:#222}
.promo-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.promo-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.promo-icon{width:38px;height:38px;border-radius:11px;background:#111;color:var(--yellow);display:grid;place-items:center;flex:0 0 38px;font-size:18px}
.promo-item b{display:block;font-size:13px}

.promo-note{font-size:10px;color:var(--muted);margin:12px 2px}
.landing-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;align-items:stretch}
.landing-actions .landing-btn{width:100%;min-width:0;min-height:44px;height:44px;padding:9px 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-family:inherit;font-size:14px;font-weight:900;line-height:1.2;white-space:nowrap;cursor:pointer;-webkit-appearance:none;appearance:none}

.landing-actions .landing-btn.secondary,.landing-actions a.landing-btn.secondary:link,.landing-actions a.landing-btn.secondary:visited{background:var(--yellow);color:#111;border:1px solid var(--yellow);text-decoration:none}
.landing-actions .landing-btn.secondary:hover,.landing-actions .landing-btn.secondary:active{background:#e5ac00;color:#111}
.auth-dropdown{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;box-shadow:0 8px 22px rgba(0,0,0,.07)}
.auth-dropdown.open{display:block}.auth-dropdown h3{margin:0 0 6px;font-size:17px}.auth-dropdown p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}

.auth-switch .landing-btn{width:100%;min-height:40px;padding:9px 8px;border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer}

.field{margin:10px 0}.field input{width:100%;border:1px solid #d0d5dd;border-radius:13px;padding:13px}
.primary{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:var(--yellow);font-weight:900}
.err{color:#b42318;font-size:12px;min-height:18px}
.nearest-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.nearest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.order-status-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.05);margin-bottom:10px}
.order-status-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-status-number{font-size:11px;color:var(--muted);font-weight:800}

.status-approved{background:#dbeafe;color:#1d4ed8}.status-packed{background:#fef3c7;color:#92400e}.status-shipped{background:#e0e7ff;color:#4338ca}.status-delivery{background:#cffafe;color:#0e7490}.status-done{background:#dcfce7;color:#166534}

.order-status-btn{width:100%;margin-top:10px}

  {icon:"💳",label:"Limit",page:"approval-limit-fixzy-business-superadmin.html"},
  {icon:"📦",label:"Pesanan",page:"data-pesanan.html"},
  {icon:"⚙",label:"Profil",page:"pengaturan.html"},
];

function createMenuBtn(item){
  const btn=document.createElement("button");btn.className="menu-btn";
  if(item.page) btn.dataset.page=item.page; if(item.service) btn.dataset.service=item.service;
  btn.innerHTML='<div class="icon">'+item.icon+(item.badgeId?'<b class="pending-dot" id="'+item.badgeId+'"></b>':'')+'</div><span>'+item.label+'</span>';
  return btn;
}
function renderBottom(items){
  const nav=document.getElementById("bottomNav");nav.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");b.className="nav";b.dataset.page=it.page||"";
    if(it.action==="home") b.id="homeNav";
    b.innerHTML='<i>'+it.icon+'</i>'+it.label;nav.appendChild(b);
  });
}
function attachEvents(){
  document.querySelectorAll("[data-page]").forEach(x=>{x.onclick=()=>{
    const p=x.dataset.page; if(!p||p==="index.html"){window.scrollTo({top:0,behavior:"smooth"});return}
    if(!auth||!auth.currentUser){alert("Navigasi ke: "+p);return} location.href=p;
  }});
  document.querySelectorAll("[data-service]").forEach(x=>x.addEventListener("click",()=>{
    const labels={transfer:"Transfer Antar Bank",pulsa:"Isi Pulsa & Kuota",wifi:"Voucher WiFi",antar:"Pesan Antar",gojeg:"Gojeg Elit"};
    alert("Menu "+(labels[x.dataset.service]||"layanan")+" ditambahkan. Halaman transaksi layanan ini belum tersedia.");
  }));
}
function hideLoader(){const el=document.getElementById("dashboardLoader");if(!el) return; el.style.opacity="0"; setTimeout(()=>el.remove(),220)}

let activeTab="kelola";
function switchTab(tab){
  activeTab=tab;
  const kelola=document.getElementById("kelolaSection");
  const ownerSec=document.getElementById("ownerAccessSection");
  const tK=document.getElementById("tabKelola"), tO=document.getElementById("tabOwner");
  if(tab==="kelola"){kelola.classList.remove("hidden"); ownerSec.classList.add("hidden"); tK.classList.add("active"); tO.classList.remove("active");}
  else{kelola.classList.add("hidden"); ownerSec.classList.remove("hidden"); tO.classList.add("active"); tK.classList.remove("active");}
}
document.getElementById("tabKelola").onclick=()=>switchTab("kelola");
document.getElementById("tabOwner").onclick=()=>switchTab("owner");

function renderMenus(role){
  const menuContainer=document.getElementById("menuContainer");
  const ownerForSuper=document.getElementById("ownerMenuForSuper");
  const tabBar=document.getElementById("superTabBar");
  menuContainer.innerHTML=""; ownerForSuper.innerHTML="";
  const badge=document.getElementById("roleBadge");
  if(role==="superadmin"){
    document.getElementById("superadminDashboard").classList.remove("hidden");
    document.getElementById("ownerDashboard").classList.add("hidden");
    badge.textContent="SUPER ADMIN"; badge.className="role-badge super";
    document.getElementById("menuTitle").textContent="Kelola Sistem";
    document.getElementById("menuSubtitle").textContent="FULL ACCESS";
    SUPER_MENUS.forEach(m=>menuContainer.appendChild(createMenuBtn(m)));
    OWNER_MENUS.forEach(m=>ownerForSuper.appendChild(createMenuBtn(m)));
    tabBar.classList.add("show");
    switchTab("kelola");
    renderBottom(BOTTOM_SUPER);
  }else{
    document.getElementById("superadminDashboard").classList.add("hidden");
    document.getElementById("ownerDashboard").classList.remove("hidden");
    badge.textContent="OWNER"; badge.className="role-badge owner";
    document.getElementById("menuTitle").textContent="Menu Layanan";
    document.getElementById("menuSubtitle").textContent="";
    OWNER_MENUS.forEach(m=>menuContainer.appendChild(createMenuBtn(m)));
    tabBar.classList.remove("show");
    document.getElementById("kelolaSection").classList.remove("hidden");
    document.getElementById("ownerAccessSection").classList.add("hidden");
    renderBottom(BOTTOM_OWNER);
  }
  attachEvents();
}

let currentRole = new URLSearchParams(location.search).get("role") || localStorage.getItem("fixzy_preview_role") || "owner";
function setPreviewRole(r,save=true){currentRole=r; if(save) localStorage.setItem("fixzy_preview_role",r); renderMenus(r);
  const o=document.getElementById("switchOwner"), s=document.getElementById("switchSuper");
  if(o&&s){o.style.background=r==="owner"?"#fff":"transparent"; o.style.color=r==="owner"?"#111":"#9ca3af"; s.style.background=r==="superadmin"?"#FFC107":"transparent"; s.style.color=r==="superadmin"?"#111":"#9ca3af";}
  document.getElementById("greeting").textContent=r==="owner"?"Toko Fixzy • Owner":"Administrator • Super Admin";
}
if(location.search.includes("demo")||location.search.includes("role")) document.getElementById("roleSwitcher").classList.add("show");
document.getElementById("switchOwner").onclick=()=>setPreviewRole("owner");
document.getElementById("switchSuper").onclick=()=>setPreviewRole("superadmin");
setPreviewRole(currentRole==="superadmin"?"superadmin":"owner",false);
setTimeout(hideLoader,600);

if(auth){
  document.getElementById("logoutBtn").onclick=async()=>{try{await signOut(auth)}catch{} location.replace("login.html")};
  onAuthStateChanged(auth,async user=>{
    if(!user) return;
    try{
      const snap=await getDoc(doc(db,"users",user.uid)); if(!snap.exists()) return;
      const profile=snap.data()||{}; const role=profile.role==="superadmin"?"superadmin":"owner";
      setPreviewRole(role); document.getElementById("greeting").textContent=profile.namaUsaha||profile.nama|| (role==="superadmin"?"Super Admin":"Owner"); hideLoader();
      if(role==="owner"){
        try{const w=await getDoc(doc(db,"wallets",user.uid)); document.getElementById("personalBalance").textContent=rupiah(w.exists()?(w.data().saldoPribadi||0):0);}catch{}
        try{const l=await getDoc(doc(db,"limits",user.uid)); document.getElementById("availableLimit").textContent=rupiah(l.exists()?(l.data().limitTersedia||0):0);}catch{}
        try{let total=0,inv=[]; const q=await getDocs(query(collection(db,"invoices"),where("ownerUid","==",user.uid))); q.forEach(i=>{const x=i.data(),s=Number(x.sisaTagihan??x.totalTagihan??x.total??0); if(s>0){total+=s; inv.push(x)}}); document.getElementById("totalInvoice").textContent=rupiah(total); document.getElementById("invoiceCount").textContent=inv.length+" tagihan";}catch{}
      }else{
        try{const owners=await getDocs(query(collection(db,"users"),where("role","==","owner"))); document.getElementById("ownerCount").textContent=owners.size;}catch{}
        const badge=(id,n)=>{const b=document.getElementById(id); if(!b) return; b.textContent=n>99?"99+":String(n); b.classList.toggle("show",n>0)};
        try{
          const [topups,limits,orders]=await Promise.all([getDocs(query(collection(db,"walletTransactions"),where("type","==","TOPUP"),where("status","==","MENUNGGU"))),getDocs(query(collection(db,"limitApplications"),where("status","==","MENUNGGU"))),getDocs(query(collection(db,"orders"),where("status","==","MENUNGGU_PERSETUJUAN")))]); 
          document.getElementById("topupCount").textContent=topups.size; badge("pendingTopup",topups.size); badge("pendingLimit",limits.size); badge("pendingOrder",orders.size);
        }catch{}
      }
    }catch(e){console.error(e); hideLoader()}
  });
}
</script>
