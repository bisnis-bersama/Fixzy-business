<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY BUSINESS | Approval Limit</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f7;
  color:#172033;
}
.header{
  background:#061d33;
  color:#fff;
  padding:22px 18px 26px;
  border-radius:0 0 28px 28px;
}
.head{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:70px;height:70px;border-radius:18px;
  object-fit:cover;background:#fff;
}
.title{font-size:25px;font-weight:800}
.sub{margin-top:5px;color:#cbd5e1}
.logout{
  margin-left:auto;
  border:1px solid #52657a;
  background:transparent;
  color:#fff;
  border-radius:14px;
  padding:12px 16px;
  font-weight:700;
}
.wrap{max-width:900px;margin:auto;padding:20px 16px 40px}
.alert{
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px;
  display:none;
  font-weight:700;
}
.alert.ok{display:block;background:#e8f7ed;color:#16743b}
.alert.err{display:block;background:#fff0f0;color:#b42318}
.card{
  background:#fff;
  border-radius:24px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 5px 22px rgba(15,23,42,.06);
}
h1{margin:0 0 6px;font-size:25px}
.muted{color:#687386}
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}
.stat{
  background:#f7f8fa;
  border:1px solid #e3e6eb;
  border-radius:18px;
  padding:16px;
}
.stat b{display:block;font-size:25px;margin-top:7px}
.pending{
  border:1px solid #e5e8ed;
  border-radius:20px;
  padding:18px;
  margin-top:14px;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}
.name{font-size:19px;font-weight:800}
.amount{font-size:25px;font-weight:800;margin-top:8px}
.meta{
  margin-top:9px;
  color:#687386;
  font-size:14px;
  line-height:1.55;
  word-break:break-word;
}
.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  background:#fff3df;
  color:#a85100;
  font-weight:800;
  font-size:12px;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:17px;
}
button.action{
  flex:1;
  border:0;
  border-radius:13px;
  padding:13px 12px;
  font-weight:800;
  font-size:15px;
}
.approve{background:#0b7a43;color:#fff}
.reject{background:#fff;color:#b42318;border:1px solid #e0b0b0!important}
.refresh{
  width:100%;
  margin-top:14px;
  background:#fff;
  color:#172033;
  border:1px solid #d8dde5;
  border-radius:14px;
  padding:14px;
  font-weight:800;
}
.empty{
  text-align:center;
  padding:35px 15px;
  color:#687386;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#172033;
  text-decoration:none;
  font-weight:700;
}
@media(max-width:620px){
  .title{font-size:21px}
  .logo{width:60px;height:60px}
  .summary{grid-template-columns:1fr}
  .row{flex-direction:column}
  .badge{align-self:flex-start}
}
</style>
</head>
<body>

<header class="header">
  <div class="head">
    <img class="logo" src="logofixzy.png" alt="FIXZY">
    <div>
      <div class="title">FIXZY BUSINESS</div>
      <div class="sub">Superadmin · Approval Limit</div>
    </div>
    <button class="logout" id="logoutBtn">Keluar</button>
  </div>
</header>

<main class="wrap">
  <div id="alert" class="alert"></div>

  <section class="card">
    <h1>Approval Limit</h1>
    <div class="muted">Periksa pengajuan limit kredit Owner dan tentukan persetujuannya.</div>

    <div class="summary">
      <div class="stat">
        <span>Menunggu</span>
        <b id="totalPending">0</b>
      </div>
      <div class="stat">
        <span>Total Pengajuan</span>
        <b id="totalNominal">Rp 0</b>
      </div>
      <div class="stat">
        <span>Diproses</span>
        <b id="totalProcessed">0</b>
      </div>
    </div>

    <button class="refresh" id="refreshBtn">↻ Refresh Data</button>
  </section>

  <section class="card">
    <h1>Pengajuan Menunggu</h1>
    <div id="list">
      <div class="empty">Memuat data...</div>
    </div>
  </section>

  <a class="back" href="index.html">← Kembali ke Dashboard</a>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore,collection,query,where,getDocs,getDoc,doc,
  runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain:"teknisi-ponsel-maja.firebaseapp.com",
  projectId:"teknisi-ponsel-maja",
  storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId:"835618012205",
  appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

function rupiah(n){
  return "Rp "+new Intl.NumberFormat("id-ID").format(Number(n)||0);
}
function show(msg,type="ok"){
  const el=$("alert");
  el.textContent=msg;
  el.className="alert "+(type==="error"?"err":"ok");
}
function hide(){
  $("alert").className="alert";
}
function timeValue(v){
  return v?.toMillis?.() || 0;
}
function formatDate(v){
  if(!v?.toDate) return "-";
  return v.toDate().toLocaleString("id-ID",{
    day:"2-digit",month:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

let currentUser=null;
let pendingData=[];

async function isSuperadmin(user){
  const token=await user.getIdTokenResult(true);
  if(token.claims?.role==="superadmin") return true;

  const snap=await getDoc(doc(db,"users",user.uid));
  const p=snap.exists()?snap.data():{};
  return p.role==="superadmin";
}

async function load(){
  hide();
  $("list").innerHTML='<div class="empty">Memuat data...</div>';

  try{
    const q=query(
      collection(db,"limitApplications"),
      where("status","==","MENUNGGU")
    );
    const snap=await getDocs(q);

    pendingData=[];
    snap.forEach(d=>{
      pendingData.push({id:d.id,...d.data()});
    });

    pendingData.sort((a,b)=>timeValue(b.createdAt)-timeValue(a.createdAt));

    $("totalPending").textContent=pendingData.length;
    $("totalNominal").textContent=rupiah(
      pendingData.reduce((s,x)=>s+(Number(x.nominalPengajuan)||0),0)
    );

    render();
    await loadProcessedCount();

  }catch(err){
    console.error(err);
    $("list").innerHTML='<div class="empty">Data tidak dapat dimuat.</div>';
    show("Gagal membaca pengajuan. Periksa Firestore Rules dan akses Superadmin.","error");
  }
}

async function loadProcessedCount(){
  try{
    const snap=await getDocs(collection(db,"limitApplications"));
    let count=0;
    snap.forEach(d=>{
      const s=d.data().status;
      if(s==="DISETUJUI" || s==="DITOLAK") count++;
    });
    $("totalProcessed").textContent=count;
  }catch(e){
    $("totalProcessed").textContent="-";
  }
}

async function getOwnerName(uid){
  try{
    const snap=await getDoc(doc(db,"users",uid));
    if(!snap.exists()) return "Owner";
    const p=snap.data();
    return p.businessName || p.namaUsaha || p.name || p.nama || p.email || "Owner";
  }catch(e){
    return "Owner";
  }
}

async function render(){
  const list=$("list");

  if(!pendingData.length){
    list.innerHTML='<div class="empty">Tidak ada pengajuan limit yang menunggu.</div>';
    return;
  }

  list.innerHTML="";
  for(const item of pendingData){
    const ownerName=await getOwnerName(item.ownerUid);

    const card=document.createElement("div");
    card.className="pending";
    card.innerHTML=`
      <div class="row">
        <div>
          <div class="name">${escapeHtml(ownerName)}</div>
          <div class="amount">${rupiah(item.nominalPengajuan)}</div>
          <div class="meta">
            Owner UID: ${escapeHtml(item.ownerUid || "-")}<br>
            Pengajuan: ${formatDate(item.createdAt)}<br>
            ID Pengajuan: ${escapeHtml(item.id)}
          </div>
        </div>
        <span class="badge">MENUNGGU</span>
      </div>
      <div class="actions">
        <button class="action approve" data-action="approve" data-id="${item.id}">
          SETUJUI
        </button>
        <button class="action reject" data-action="reject" data-id="${item.id}">
          TOLAK
        </button>
      </div>
    `;
    list.appendChild(card);
  }

  list.querySelectorAll("button[data-action]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const id=btn.dataset.id;
      const action=btn.dataset.action;
      if(action==="approve") await processApplication(id,true,btn);
      else await processApplication(id,false,btn);
    });
  });
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function processApplication(id,approve,clickedBtn){
  const item=pendingData.find(x=>x.id===id);
  if(!item) return;

  const actionText=approve?"menyetujui":"menolak";
  const nominal=Number(item.nominalPengajuan)||0;

  if(!nominal){
    show("Nominal pengajuan tidak valid.","error");
    return;
  }

  let reason="";
  if(!approve){
    reason=prompt("Alasan penolakan (opsional):") || "";
  }else{
    const ok=confirm(
      "Setujui limit "+rupiah(nominal)+" untuk Owner ini?\n\n"+
      "Limit disetujui akan menjadi "+rupiah(nominal)+"."
    );
    if(!ok) return;
  }

  const card=clickedBtn.closest(".pending");
  card.querySelectorAll("button").forEach(b=>b.disabled=true);
  clickedBtn.textContent=approve?"MEMPROSES...":"MEMPROSES...";

  try{
    await runTransaction(db,async(tx)=>{
      const appRef=doc(db,"limitApplications",id);
      const appSnap=await tx.get(appRef);

      if(!appSnap.exists()) throw new Error("Pengajuan tidak ditemukan.");

      const application=appSnap.data();
      if(application.status!=="MENUNGGU"){
        throw new Error("Pengajuan ini sudah diproses.");
      }

      const ownerUid=application.ownerUid;
      const requested=Number(application.nominalPengajuan)||0;
      if(!ownerUid || requested<=0) throw new Error("Data pengajuan tidak valid.");

      const limitRef=doc(db,"limits",ownerUid);
      const limitSnap=await tx.get(limitRef);
      const old=limitSnap.exists()?limitSnap.data():{};

      const used=Number(old.limitTerpakai)||0;

      if(approve){
        if(requested<used){
          throw new Error(
            "Nominal limit baru lebih kecil dari limit yang sudah terpakai."
          );
        }

        const available=requested-used;

        tx.set(limitRef,{
          ownerUid,
          limitDisetujui:requested,
          limitTerpakai:used,
          limitTersedia:available,
          status:"DISETUJUI",
          updatedAt:serverTimestamp()
        },{merge:true});

        tx.update(appRef,{
          status:"DISETUJUI",
          nominalDisetujui:requested,
          limitTersediaSesudah:available,
          processedBy:auth.currentUser.uid,
          processedAt:serverTimestamp()
        });
      }else{
        tx.update(appRef,{
          status:"DITOLAK",
          alasanPenolakan:reason,
          processedBy:auth.currentUser.uid,
          processedAt:serverTimestamp()
        });
      }
    });

    show(approve
      ?"Pengajuan limit berhasil disetujui."
      :"Pengajuan limit berhasil ditolak."
    );

    await load();

  }catch(err){
    console.error(err);
    show(
      "Gagal "+actionText+" pengajuan: "+
      (err.message||"Periksa Firestore Rules."),
      "error"
    );
    card.querySelectorAll("button").forEach(b=>b.disabled=false);
    clickedBtn.textContent=approve?"SETUJUI":"TOLAK";
  }
}

$("refreshBtn").addEventListener("click",load);
$("logoutBtn").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  currentUser=user;

  try{
    const ok=await isSuperadmin(user);
    if(!ok){
      document.body.innerHTML=`
        <div style="padding:40px;text-align:center;font-family:Arial">
          <h2>Akses ditolak</h2>
          <p>Halaman ini khusus Superadmin.</p>
          <a href="index.html">Kembali</a>
        </div>`;
      return;
    }

    await load();
  }catch(e){
    console.error(e);
    show("Gagal memeriksa akses Superadmin.","error");
  }
});
</script>
</body>
</html>
