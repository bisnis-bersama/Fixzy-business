<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY BUSINESS | Approval Limit</title>
<style>
:root{--yellow:#FFC107;--black:#111;--bg:#f3f4f6;--white:#fff;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.app{width:100%;max-width:1180px;margin:auto;min-height:100vh;padding-bottom:82px}
.top{background:#111;color:#fff;padding:18px 18px 82px;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--yellow);display:grid;place-items:center;flex:0 0 48px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.2px;color:var(--yellow)}
.brand small{display:block;color:#d1d5db;margin-top:3px;font-size:12px}
.home{color:#fff;text-decoration:none;font-size:23px;padding:6px}
.content{padding:0 clamp(14px,3vw,28px);margin-top:-60px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.hero-title{font-size:20px;font-weight:900;margin:0}
.hero-note{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#f8f8f8;border-radius:14px;padding:13px}
.stat span{display:block;color:var(--muted);font-size:11px}
.stat b{display:block;margin-top:6px;font-size:20px}
.refresh{border:0;background:#111;color:var(--yellow);border-radius:11px;padding:11px 13px;font-weight:900;font-size:12px;cursor:pointer;width:100%;margin-top:12px}
.pending{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:15px;font-weight:900}
.amount{font-size:21px;font-weight:900;margin-top:6px}
.meta{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.6;word-break:break-word}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:900;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:12px}
button.action{flex:1;border:0;border-radius:11px;padding:11px 10px;font-weight:900;font-size:12px;cursor:pointer}
.approve{background:var(--green);color:#fff}
.reject{background:var(--red);color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}
.alert{display:none;padding:11px 13px;border-radius:11px;margin-bottom:12px;font-size:12px;font-weight:700}
.alert.ok{display:block;background:#dcfce7;color:#166534}
.alert.err{display:block;background:#fee2e2;color:#991b1b}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}
.nav{border:0;background:transparent;color:var(--yellow);font-size:10px;font-weight:800;text-decoration:none;text-align:center;padding:3px}
.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px;color:var(--yellow)}
.nav.active{color:var(--yellow)}
@media(max-width:700px){.top{padding:16px 15px 66px}.content{margin-top:-42px}.summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.summary{grid-template-columns:1fr 1fr 1fr}.row{flex-direction:column}.badge{align-self:flex-start}}
</style>
</head>
<body>

<div class="app">
<header class="top">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"><img src="logofixzy.png" alt="FIXZY"></div>
      <div>
        <h1>FIXZY BUSINESS</h1>
        <small>Superadmin · Approval Limit</small>
      </div>
    </div>
    <a class="home" href="index.html" title="Dashboard">⌂</a>
  </div>
</header>

<main class="content">
  <div id="alert" class="alert"></div>

  <section class="card">
    <h2 class="hero-title">Approval Limit</h2>
    <p class="hero-note">Setiap pengajuan yang disetujui akan menambah limit Owner.</p>

    <div class="summary">
      <div class="stat">
        <span>Menunggu</span>
        <b id="totalPending">0</b>
      </div>
      <div class="stat">
        <span>Total Pengajuan</span>
        <b id="totalNominal">Rp 0</b>
      </div>
      <div class="stat">
        <span>Diproses</span>
        <b id="totalProcessed">0</b>
      </div>
    </div>

    <button class="refresh" id="refreshBtn">↻ Refresh Data</button>
  </section>

  <section class="card">
    <h2 class="hero-title">Pengajuan Menunggu</h2>
    <div id="list">
      <div class="empty">Memuat data...</div>
    </div>
  </section>

  <a class="back" href="index.html">← Kembali ke Dashboard</a>
</main>
<nav class="bottom">
  <a class="nav" href="index.html"><i>⌂</i>Beranda</a>
  <a class="nav" href="data-produk.html"><i>▦</i>Produk</a>
  <a class="nav" href="data-pesanan.html"><i>🛒</i>Pesanan</a>
  <a class="nav" href="data-tagihan.html"><i>▤</i>Tagihan</a>
  <a class="nav active" href="pengaturan.html"><i>⚙</i>Profil</a>
</nav>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore,collection,query,where,getDocs,getDoc,doc,
  runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain:"teknisi-ponsel-maja.firebaseapp.com",
  projectId:"teknisi-ponsel-maja",
  storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId:"835618012205",
  appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

function rupiah(n){
  return "Rp "+new Intl.NumberFormat("id-ID").format(Number(n)||0);
}
function show(msg,type="ok"){
  const el=$("alert");
  el.textContent=msg;
  el.className="alert "+(type==="error"?"err":"ok");
}
function hide(){
  $("alert").className="alert";
}
function timeValue(v){
  return v?.toMillis?.() || 0;
}
function formatDate(v){
  if(!v?.toDate) return "-";
  return v.toDate().toLocaleString("id-ID",{
    day:"2-digit",month:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

let currentUser=null;
let pendingData=[];

async function isSuperadmin(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  const p=snap.exists()?snap.data():{};
  return p.role==="superadmin";
}

async function load(){
  hide();
  $("list").innerHTML='<div class="empty">Memuat data...</div>';

  try{
    const q=query(
      collection(db,"limitApplications"),
      where("status","==","MENUNGGU")
    );
    const snap=await getDocs(q);

    pendingData=[];
    snap.forEach(d=>{
      pendingData.push({id:d.id,...d.data()});
    });

    pendingData.sort((a,b)=>timeValue(b.createdAt)-timeValue(a.createdAt));

    $("totalPending").textContent=pendingData.length;
    $("totalNominal").textContent=rupiah(
      pendingData.reduce((s,x)=>s+(Number(x.nominalPengajuan)||0),0)
    );

    render();
    await loadProcessedCount();

  }catch(err){
    console.error(err);
    $("list").innerHTML='<div class="empty">Data tidak dapat dimuat.</div>';
    show("Gagal membaca pengajuan. Periksa Firestore Rules dan akses Superadmin.","error");
  }
}

async function loadProcessedCount(){
  try{
    const snap=await getDocs(collection(db,"limitApplications"));
    let count=0;
    snap.forEach(d=>{
      const s=d.data().status;
      if(s==="DISETUJUI" || s==="DITOLAK") count++;
    });
    $("totalProcessed").textContent=count;
  }catch(e){
    $("totalProcessed").textContent="-";
  }
}

async function getOwnerName(uid){
  try{
    const snap=await getDoc(doc(db,"users",uid));
    if(!snap.exists()) return "Owner";
    const p=snap.data();
    return p.businessName || p.namaUsaha || p.name || p.nama || p.email || "Owner";
  }catch(e){
    return "Owner";
  }
}

async function render(){
  const list=$("list");

  if(!pendingData.length){
    list.innerHTML='<div class="empty">Tidak ada pengajuan limit yang menunggu.</div>';
    return;
  }

  list.innerHTML="";
  for(const item of pendingData){
    const ownerName=await getOwnerName(item.ownerUid);

    const card=document.createElement("div");
    card.className="pending";
    card.innerHTML=`
      <div class="row">
        <div>
          <div class="name">${escapeHtml(ownerName)}</div>
          <div class="amount">${rupiah(item.nominalPengajuan)}</div>
          <div class="meta">
            Owner UID: ${escapeHtml(item.ownerUid || "-")}<br>
            Pengajuan: ${formatDate(item.createdAt)}<br>
            ID Pengajuan: ${escapeHtml(item.id)}
          </div>
        </div>
        <span class="badge">MENUNGGU</span>
      </div>
      <div class="actions">
        <button class="action approve" data-action="approve" data-id="${item.id}">
          SETUJUI
        </button>
        <button class="action reject" data-action="reject" data-id="${item.id}">
          TOLAK
        </button>
      </div>
    `;
    list.appendChild(card);
  }

  list.querySelectorAll("button[data-action]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const id=btn.dataset.id;
      const action=btn.dataset.action;
      if(action==="approve") await processApplication(id,true,btn);
      else await processApplication(id,false,btn);
    });
  });
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function processApplication(id,approve,clickedBtn){
  const item=pendingData.find(x=>x.id===id);
  if(!item) return;

  const actionText=approve?"menyetujui":"menolak";
  const nominal=Number(item.nominalPengajuan)||0;

  if(!nominal){
    show("Nominal pengajuan tidak valid.","error");
    return;
  }

  let reason="";
  if(!approve){
    reason=prompt("Alasan penolakan (opsional):") || "";
  }else{
    const ok=confirm(
      "Tambahkan limit "+rupiah(nominal)+" untuk Owner ini?\n\n"+
      "Nominal ini akan DITAMBAHKAN ke limit yang sudah ada."
    );
    if(!ok) return;
  }

  const card=clickedBtn.closest(".pending");
  card.querySelectorAll("button").forEach(b=>b.disabled=true);
  clickedBtn.textContent=approve?"MEMPROSES...":"MEMPROSES...";

  try{
    await runTransaction(db,async(tx)=>{
      const appRef=doc(db,"limitApplications",id);
      const appSnap=await tx.get(appRef);

      if(!appSnap.exists()) throw new Error("Pengajuan tidak ditemukan.");

      const application=appSnap.data();
      if(application.status!=="MENUNGGU"){
        throw new Error("Pengajuan ini sudah diproses.");
      }

      const ownerUid=application.ownerUid;
      const requested=Number(application.nominalPengajuan)||0;
      if(!ownerUid || requested<=0) throw new Error("Data pengajuan tidak valid.");

      const limitRef=doc(db,"limits",ownerUid);
      const limitSnap=await tx.get(limitRef);
      const old=limitSnap.exists()?limitSnap.data():{};

      const used=Number(old.limitTerpakai)||0;
      const oldApproved=Number(old.limitDisetujui)||0;

      if(approve){
        // Pengajuan adalah TAMBAHAN limit, bukan mengganti limit lama.
        const newApproved=oldApproved+requested;
        const available=newApproved-used;

        if(available<0){
          throw new Error(
            "Perhitungan limit tidak valid karena limit terpakai melebihi limit baru."
          );
        }

        tx.set(limitRef,{
          ownerUid,
          limitDisetujui:newApproved,
          limitTerpakai:used,
          limitTersedia:available,
          status:"DISETUJUI",
          updatedAt:serverTimestamp()
        },{merge:true});

        tx.update(appRef,{
          status:"DISETUJUI",
          nominalDisetujui:requested,
          nominalTambahan:requested,
          limitSebelum:oldApproved,
          limitSesudah:newApproved,
          limitTerpakai:used,
          limitTersediaSesudah:available,
          processedBy:auth.currentUser.uid,
          processedAt:serverTimestamp()
        });
      }else{
        tx.update(appRef,{
          status:"DITOLAK",
          alasanPenolakan:reason,
          processedBy:auth.currentUser.uid,
          processedAt:serverTimestamp()
        });
      }
    });

    show(approve
      ?"Pengajuan limit berhasil disetujui."
      :"Pengajuan limit berhasil ditolak."
    );

    await load();

  }catch(err){
    console.error(err);
    show(
      "Gagal "+actionText+" pengajuan: "+
      (err.message||"Periksa Firestore Rules."),
      "error"
    );
    card.querySelectorAll("button").forEach(b=>b.disabled=false);
    clickedBtn.textContent=approve?"SETUJUI":"TOLAK";
  }
}

$("refreshBtn").addEventListener("click",load);
onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="index.html";
    return;
  }

  currentUser=user;

  try{
    const ok=await isSuperadmin(user);
    if(!ok){
      alert("Akses hanya untuk Superadmin.");
      location.href="index.html";
      return;
    }

    await load();
  }catch(e){
    console.error(e);
    show("Gagal memeriksa akses Superadmin.","error");
  }
});
</script>
</body>
</html>
