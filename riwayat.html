<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152b">
<title>FIXZY BUSINESS | Riwayat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#101828;font-family:Arial,Helvetica,sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:30px}
.header{background:#07152b;color:#fff;padding:22px 18px 26px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:16px;background:#fff;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:21px}
.sub{margin-top:4px;color:#aab6c8;font-size:12px}
.content{padding:0 16px}
.card{background:#fff;border:1px solid #eaecf0;border-radius:22px;margin-top:16px;padding:18px;box-shadow:0 6px 24px #10182812}
.title{font-size:21px;font-weight:900}
.muted{margin-top:4px;color:#667085;font-size:12px}
.summary{margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.summary b{font-size:15px}.summary span{display:block;color:#667085;font-size:11px;margin-top:2px}
.search{width:100%;margin-top:14px;padding:12px 13px;border:1px solid #d0d5dd;border-radius:13px;font-size:14px;outline:none}
.filters{display:flex;gap:7px;overflow:auto;margin-top:11px;padding-bottom:3px}
.filters button{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:20px;padding:8px 12px;white-space:nowrap;font-weight:800;font-size:12px}
.filters button.active{background:#07152b;color:#fff;border-color:#07152b}
.refresh,.back{width:100%;padding:12px;border-radius:12px;font-weight:800}
.refresh{margin-top:11px;border:0;background:#07152b;color:#fff}
.back{margin-top:10px;border:1px solid #d0d5dd;background:#fff;color:#344054}
.item{padding:14px 0;border-bottom:1px solid #eaecf0}
.item:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;gap:10px}
.left{min-width:0}
.amount{font-size:18px;font-weight:900}
.amount.in{color:#027a48}.amount.out{color:#b42318}
.desc{font-weight:800;margin-top:3px;font-size:13px}
.date{color:#667085;font-size:11px;margin-top:4px}
.badge{height:max-content;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:900;white-space:nowrap}
.pending{background:#fff4e5;color:#b54708}.approved{background:#ecfdf3;color:#027a48}.rejected{background:#fef3f2;color:#b42318}
.detail{display:none;margin-top:9px;background:#f8fafc;border-radius:12px;padding:10px;font-size:12px;line-height:1.7;word-break:break-word}
.item.open .detail{display:block}
.more{margin-top:7px;border:0;background:none;padding:0;color:#344054;font-size:12px;font-weight:800}
.empty,.loading{text-align:center;color:#667085;padding:28px 5px;font-size:12px}
.error{margin-top:11px;background:#fef3f2;color:#b42318;padding:11px;border-radius:12px;font-size:12px}
@media(max-width:420px){.brand h1{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="logo"><img src="logofixzy.png" alt="FIXZY BUSINESS"></div>
    <div>
      <h1>FIXZY BUSINESS</h1>
      <div class="sub" id="roleLabel">Riwayat Semua Transaksi</div>
    </div>
  </div>
</header>

<main class="content">
<section class="card">
  <div class="title">Riwayat Semua Transaksi</div>
  <div class="muted">Seluruh transaksi saldo akun ini.</div>

  <div class="summary">
    <div><b id="count">0</b><span>TRANSAKSI</span></div>
    <div><b id="inTotal">Rp0</b><span>DANA MASUK</span></div>
    <div><b id="outTotal">Rp0</b><span>DANA KELUAR</span></div>
  </div>

  <input id="search" class="search" placeholder="Cari nominal, jenis, metode, referensi...">

  <div class="filters">
    <button class="active" data-filter="SEMUA">Semua</button>
    <button data-filter="MASUK">Dana Masuk</button>
    <button data-filter="KELUAR">Dana Keluar</button>
    <button data-filter="MENUNGGU">Menunggu</button>
    <button data-filter="DISETUJUI">Disetujui</button>
    <button data-filter="DITOLAK">Ditolak</button>
  </div>

  <button class="refresh" id="refresh">↻ Refresh</button>
  <div id="message"></div>
  <div id="list"><div class="loading">Memuat transaksi...</div></div>
  <button class="back" id="back">← Kembali ke Dashboard</button>
</section>
</main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain:"teknisi-ponsel-maja.firebaseapp.com",
  projectId:"teknisi-ponsel-maja",
  storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId:"835618012205",
  appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
await setPersistence(auth,browserLocalPersistence);
await auth.authStateReady();

const $=id=>document.getElementById(id);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);

let currentUser=auth.currentUser;
let role="";
let rows=[];
let activeFilter="SEMUA";

function dateText(v){
  if(!v) return "-";
  if(v.toDate) return v.toDate().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return "-";
}

function statusClass(s){
  if(s==="DISETUJUI") return "approved";
  if(s==="DITOLAK") return "rejected";
  return "pending";
}

function transactionType(x){
  const t=String(x.type||x.jenis||x.category||"").toUpperCase();
  if(["TOPUP","DANA_MASUK","MASUK","REFUND","PENGEMBALIAN"].includes(t)) return "MASUK";
  if(["BELANJA","PEMBAYARAN","PEMBAYARAN_TAGIHAN","TAGIHAN","DANA_KELUAR","KELUAR","DEBIT"].includes(t)) return "KELUAR";
  if(String(x.direction||x.arah||"").toUpperCase()==="IN") return "MASUK";
  if(String(x.direction||x.arah||"").toUpperCase()==="OUT") return "KELUAR";
  return Number(x.amount??x.jumlah??x.nilai??0)<0 ? "KELUAR" : "MASUK";
}

function amountValue(x){
  const n=Number(x.nominal??x.amount??x.jumlah??x.nilai??0);
  return Math.abs(n)||0;
}

function typeLabel(x){
  const t=String(x.type||x.jenis||"TRANSAKSI").toUpperCase();
  const map={
    TOPUP:"Top Up Saldo",
    DANA_MASUK:"Dana Masuk",
    REFUND:"Pengembalian",
    BELANJA:"Belanja",
    PEMBAYARAN:"Pembayaran",
    PEMBAYARAN_TAGIHAN:"Pembayaran Tagihan",
    TAGIHAN:"Tagihan",
    DANA_KELUAR:"Dana Keluar"
  };
  return map[t]||t;
}

function render(){
  const key=$("search").value.trim().toLowerCase();
  let data=[...rows];

  if(activeFilter==="MASUK" || activeFilter==="KELUAR")
    data=data.filter(x=>transactionType(x)===activeFilter);
  else if(["MENUNGGU","DISETUJUI","DITOLAK"].includes(activeFilter))
    data=data.filter(x=>(x.status||"MENUNGGU")===activeFilter);

  if(key){
    data=data.filter(x=>{
      const text=[
        x.type,x.jenis,x.nominal,x.amount,x.jumlah,x.nilai,
        x.metode,x.referensi,x.status,x.ownerUid,x.invoiceNo
      ].join(" ").toLowerCase();
      return text.includes(key);
    });
  }

  if(!data.length){
    $("list").innerHTML='<div class="empty">Belum ada transaksi yang sesuai.</div>';
    return;
  }

  $("list").innerHTML="";
  data.forEach(x=>{
    const dir=transactionType(x);
    const amount=amountValue(x);
    const status=x.status||"-";
    const item=document.createElement("div");
    item.className="item";
    item.innerHTML=`
      <div class="row">
        <div class="left">
          <div class="amount ${dir==="MASUK"?"in":"out"}">${dir==="MASUK"?"+":"-"} ${rupiah(amount)}</div>
          <div class="desc">${typeLabel(x)}</div>
          <div class="date">${dateText(x.createdAt)}${x.metode?" • "+String(x.metode):""}</div>
        </div>
        <span class="badge ${statusClass(status)}">${status}</span>
      </div>
      <button class="more">Lihat detail</button>
      <div class="detail">
        <b>Jenis:</b> ${typeLabel(x)}<br>
        <b>Nilai:</b> ${rupiah(amount)}<br>
        <b>Status:</b> ${status}<br>
        <b>Metode:</b> ${x.metode||"-"}<br>
        <b>Referensi:</b> ${x.referensi||"-"}
        ${x.kodeUnik!=null?`<br><b>Kode Unik:</b> ${x.kodeUnik}`:""}
        ${x.totalTransfer!=null?`<br><b>Total Transfer:</b> ${rupiah(x.totalTransfer)}`:""}
        ${x.saldoSebelum!=null?`<br><b>Saldo Sebelum:</b> ${rupiah(x.saldoSebelum)}`:""}
        ${x.saldoSesudah!=null?`<br><b>Saldo Sesudah:</b> ${rupiah(x.saldoSesudah)}`:""}
        ${role==="superadmin"&&x.ownerUid?`<br><b>Owner UID:</b> ${x.ownerUid}`:""}
        ${x.verifiedAt?`<br><b>Diverifikasi:</b> ${dateText(x.verifiedAt)}`:""}
      </div>`;
    item.querySelector(".more").onclick=()=>{
      item.classList.toggle("open");
      item.querySelector(".more").textContent=item.classList.contains("open")?"Tutup detail":"Lihat detail";
    };
    $("list").appendChild(item);
  });
}

async function load(){
  $("list").innerHTML='<div class="loading">Memuat transaksi...</div>';
  $("message").innerHTML="";

  try{
    let q;
    if(role==="superadmin"){
      q=query(collection(db,"walletTransactions"));
    }else{
      q=query(collection(db,"walletTransactions"),where("ownerUid","==",currentUser.uid));
    }

    const snap=await getDocs(q);
    rows=[];
    snap.forEach(d=>rows.push({id:d.id,...d.data()}));
    rows.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));

    let masuk=0,keluar=0;
    rows.forEach(x=>{
      const n=amountValue(x);
      if(transactionType(x)==="MASUK") masuk+=n;
      else keluar+=n;
    });

    $("count").textContent=rows.length;
    $("inTotal").textContent=rupiah(masuk);
    $("outTotal").textContent=rupiah(keluar);
    render();
  }catch(e){
    console.error(e);
    $("list").innerHTML="";
    $("message").className="error";
    $("message").textContent="Transaksi tidak dapat dimuat. Periksa Firestore Rules atau koneksi.";
  }
}

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.onclick=()=>{
    activeFilter=btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
});
$("search").oninput=render;
$("refresh").onclick=load;
$("back").onclick=()=>{location.href="index.html"};

if(!currentUser){
  $("message").className="error";
  $("message").textContent="Sesi login tidak ditemukan. Silakan kembali ke Dashboard.";
}else{
  try{
    const profileSnap=await getDoc(doc(db,"users",currentUser.uid));
    const profile=profileSnap.exists()?profileSnap.data():{};
    const token=await currentUser.getIdTokenResult(true);
    if(token.claims?.role==="superadmin" || profile.role==="superadmin"){
      role="superadmin";
    }else if(profile.role==="owner" && profile.ownerUid===currentUser.uid){
      role="owner";
    }

    if(!role){
      $("message").className="error";
      $("message").textContent="Akses ditolak.";
    }else{
      $("roleLabel").textContent=role==="superadmin"
        ?"Riwayat Semua Transaksi • Superadmin"
        :"Riwayat Semua Transaksi • Owner";
      await load();
    }
  }catch(e){
    console.error(e);
    $("message").className="error";
    $("message").textContent="Gagal memeriksa akun. Silakan kembali ke Dashboard.";
  }
}
</script>
</body>
</html>
