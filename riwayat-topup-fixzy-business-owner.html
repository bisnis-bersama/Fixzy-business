<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY BUSINESS | Riwayat Top Up</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f5f8;
  color:#101828;
  font-family:Arial,sans-serif;
}
.app{max-width:720px;margin:auto;padding-bottom:30px}
.header{
  background:#07152b;
  color:#fff;
  padding:24px 18px 28px;
  border-radius:0 0 30px 30px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  width:60px;
  height:60px;
  border-radius:17px;
  background:#fff;
  overflow:hidden;
  flex:none;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.brand h1{
  margin:0;
  font-size:22px;
}
.brand p{
  margin:5px 0 0;
  color:#aab6c8;
  font-size:13px;
}
.logout{
  border:1px solid #ffffff33;
  background:#ffffff12;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
}
.content{padding:0 16px}
.card{
  background:#fff;
  border-radius:22px;
  margin-top:16px;
  padding:20px;
  box-shadow:0 6px 24px #10182812;
}
.title{
  font-size:21px;
  font-weight:800;
  margin-bottom:14px;
}
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  background:#f8fafc;
  border-radius:16px;
  padding:15px;
}
.stat small{
  color:#667085;
  font-size:12px;
  font-weight:700;
}
.stat b{
  display:block;
  margin-top:7px;
  font-size:20px;
}
.filter{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:2px;
}
.filter button{
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  border-radius:20px;
  padding:9px 13px;
  white-space:nowrap;
  font-weight:700;
}
.filter button.active{
  background:#07152b;
  color:#fff;
  border-color:#07152b;
}
.item{
  border:1px solid #eaecf0;
  border-radius:18px;
  padding:15px;
  margin-top:12px;
}
.item-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.amount{
  font-size:20px;
  font-weight:900;
}
.date{
  color:#667085;
  font-size:12px;
  margin-top:4px;
}
.badge{
  height:max-content;
  border-radius:20px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
}
.pending{
  background:#fff4e5;
  color:#b54708;
}
.approved{
  background:#ecfdf3;
  color:#027a48;
}
.rejected{
  background:#fef3f2;
  color:#b42318;
}
.detail{
  background:#f8fafc;
  border-radius:13px;
  padding:12px;
  margin-top:12px;
  font-size:12px;
  line-height:1.75;
}
.detail b{color:#101828}
.empty{
  text-align:center;
  color:#667085;
  padding:30px 10px;
}
.loading{
  text-align:center;
  color:#667085;
  padding:25px 10px;
}
.message{
  display:none;
  border-radius:13px;
  padding:12px;
  margin-bottom:12px;
  font-size:13px;
}
.message.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}
.message.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}
.refresh{
  width:100%;
  margin-top:13px;
  border:0;
  border-radius:13px;
  background:#07152b;
  color:#fff;
  padding:13px;
  font-weight:800;
}
@media(max-width:420px){
  .brand h1{font-size:20px}
  .logo{width:56px;height:56px}
  .summary{grid-template-columns:1fr 1fr}
  .amount{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="brand">
    <div class="brand-left">
      <div class="logo">
        <img src="logofixzy.png" alt="FIXZY BUSINESS">
      </div>
      <div>
        <h1>FIXZY BUSINESS</h1>
        <p>Riwayat Top Up • Owner & Superadmin</p>
      </div>
    </div>
    <button class="logout" id="logoutBtn">Keluar</button>
  </div>
</header>

<main class="content">

  <div id="message" class="message"></div>

  <section class="card">
    <div class="title">Riwayat Top Up</div>

    <div class="summary">
      <div class="stat">
        <small>TOTAL TOP UP</small>
        <b id="totalNominal">Rp0</b>
      </div>
      <div class="stat">
        <small>JUMLAH TRANSAKSI</small>
        <b id="totalTransaksi">0</b>
      </div>
    </div>

    <button class="refresh" id="refreshBtn">↻ Refresh Riwayat</button>
  </section>

  <section class="card">
    <div class="filter">
      <button class="active" data-filter="SEMUA">Semua</button>
      <button data-filter="MENUNGGU">Menunggu</button>
      <button data-filter="DISETUJUI">Disetujui</button>
      <button data-filter="DITOLAK">Ditolak</button>
    </div>

    <div id="list">
      <div class="loading">Memuat riwayat...</div>
    </div>
  </section>

</main>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
   ===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

const rupiah = n =>
  new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(Number(n)||0);

let currentUser = null;
let allRows = [];
let activeFilter = "SEMUA";


/* =====================================================
   FORMAT TANGGAL
   ===================================================== */

function formatDate(ts){

  if(!ts) return "-";

  if(ts.toDate){
    return ts.toDate().toLocaleString("id-ID",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  return "-";
}


/* =====================================================
   STATUS
   ===================================================== */

function statusClass(status){

  if(status === "DISETUJUI") return "approved";
  if(status === "DITOLAK") return "rejected";

  return "pending";
}


/* =====================================================
   TAMPILKAN DATA
   ===================================================== */

function render(){

  let rows = [...allRows];

  if(activeFilter !== "SEMUA"){
    rows = rows.filter(x => x.status === activeFilter);
  }

  if(!rows.length){

    $( "list" ).innerHTML =
      '<div class="empty">Belum ada riwayat Top Up.</div>';

    return;
  }

  $( "list" ).innerHTML = "";

  rows.forEach(x => {

    const status = x.status || "MENUNGGU";

    const totalTransfer =
      Number(x.totalTransfer) ||
      ((Number(x.nominal)||0) + (Number(x.kodeUnik)||0));

    const el = document.createElement("div");

    el.className = "item";

    el.innerHTML = `
      <div class="item-top">

        <div>
          <div class="amount">
            ${rupiah(x.nominal)}
          </div>

          <div class="date">
            ${formatDate(x.createdAt)}
            • ${x.metode || "-"}
          </div>
        </div>

        <span class="badge ${statusClass(status)}">
          ${status}
        </span>

      </div>

      <div class="detail">

        <b>Nominal Top Up:</b>
        ${rupiah(x.nominal)}
        <br>

        <b>Kode Unik:</b>
        ${x.kodeUnik ?? "-"}
        <br>

        <b>Total Transfer:</b>
        ${rupiah(totalTransfer)}
        <br>

        <b>Metode:</b>
        ${x.metode || "-"}
        <br>

        <b>Referensi:</b>
        ${x.referensi || "-"}
        <br>

        ${
          status === "DISETUJUI"
          ? `
            <b>Saldo Sebelum:</b>
            ${rupiah(x.saldoSebelum)}
            <br>

            <b>Saldo Sesudah:</b>
            ${rupiah(x.saldoSesudah)}
            <br>

            <b>Diverifikasi:</b>
            ${formatDate(x.verifiedAt)}
          `
          : ""
        }

        ${
          status === "DITOLAK"
          ? `
            <b>Diverifikasi:</b>
            ${formatDate(x.verifiedAt)}
          `
          : ""
        }

      </div>
    `;

    $( "list" ).appendChild(el);

  });
}


/* =====================================================
   LOAD RIWAYAT
   ===================================================== */

async function loadHistory(){

  $( "list" ).innerHTML =
    '<div class="loading">Memuat riwayat...</div>';

  try{

    const q = query(
      collection(db,"walletTransactions"),
      where("ownerUid","==",currentUser.uid),
      where("type","==","TOPUP")
    );

    const snap = await getDocs(q);

    allRows = [];

    snap.forEach(d => {

      allRows.push({
        id:d.id,
        ...d.data()
      });

    });

    allRows.sort((a,b) => {

      const ta = a.createdAt?.toMillis?.() || 0;
      const tb = b.createdAt?.toMillis?.() || 0;

      return tb - ta;

    });

    const total = allRows.reduce(
      (sum,x) => sum + (Number(x.nominal)||0),
      0
    );

    $( "totalNominal" ).textContent = rupiah(total);
    $( "totalTransaksi" ).textContent = allRows.length;

    render();

  }catch(error){

    console.error(error);

    $( "list" ).innerHTML =
      '<div class="empty">Riwayat belum dapat dimuat.</div>';

    $( "message" ).className = "message error";
    $( "message" ).textContent =
      "Gagal memuat riwayat. Periksa koneksi internet atau Firestore Rules.";

  }

}


/* =====================================================
   FILTER
   ===================================================== */

document.querySelectorAll("[data-filter]").forEach(btn => {

  btn.addEventListener("click",() => {

    activeFilter = btn.dataset.filter;

    document
      .querySelectorAll("[data-filter]")
      .forEach(x => x.classList.remove("active"));

    btn.classList.add("active");

    render();

  });

});


/* =====================================================
   REFRESH
   ===================================================== */

$( "refreshBtn" ).onclick = async () => {

  if(!currentUser) return;

  await loadHistory();

};


/* =====================================================
   LOGOUT
   ===================================================== */

$( "logoutBtn" ).onclick = async () => {

  await signOut(auth);

  location.href = "index.html";

};


/* =====================================================
   AUTH
   ===================================================== */

await setPersistence(
  auth,
  browserLocalPersistence
);

async function checkAccess(user){

  // Superadmin boleh membuka halaman ini.
  const token = await user.getIdTokenResult(true);

  if(token.claims?.role === "superadmin"){
    return true;
  }

  // Owner hanya boleh melihat riwayat Top Up miliknya sendiri.
  const profileRef = doc(db,"users",user.uid);
  const profileSnap = await getDoc(profileRef);

  if(!profileSnap.exists()){
    return false;
  }

  const profile = profileSnap.data() || {};
  return profile.role === "owner" && profile.ownerUid === user.uid;
}


onAuthStateChanged(auth, async user => {

  if(!user){

    location.href = "index.html";
    return;

  }

  try{

    const allowed = await checkAccess(user);

    if(!allowed){

      $( "list" ).innerHTML =
        '<div class="empty">Akses ditolak. Halaman ini hanya untuk Owner atau Superadmin.</div>';

      $( "message" ).className = "message error";
      $( "message" ).textContent =
        "Akun ini tidak memiliki akses ke Riwayat Top Up.";

      return;
    }

    currentUser = user;

    await loadHistory();

  }catch(error){

    console.error(error);

    $( "list" ).innerHTML =
      '<div class="empty">Tidak dapat memeriksa akses akun.</div>';

    $( "message" ).className = "message error";
    $( "message" ).textContent =
      "Gagal memeriksa akses. Silakan login kembali.";

  }

});

</script>

</body>
</html>
