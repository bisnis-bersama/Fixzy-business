<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIXZY BUSINESS — Superadmin</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1180px;margin:auto;min-height:100vh}
.header{background:#111;color:#fff;padding:24px 28px 72px;border-radius:0 0 32px 32px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand-left{display:flex;align-items:center;gap:14px}
.logo{width:62px;height:62px;border-radius:16px;background:#fff;overflow:hidden;flex:0 0 62px}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;color:#FFC107;font-size:22px;font-weight:900}
.brand p{margin:4px 0 0;color:#ddd;font-size:14px}
.logout{border:1px solid #3a3a3a;background:#191919;color:#ddd;border-radius:15px;padding:12px 17px;font-size:15px}
.content{padding:0 26px 50px;margin-top:-38px}
.hero{background:#071b39;color:#fff;border-radius:38px;padding:30px 32px;box-shadow:0 10px 28px rgba(0,0,0,.08)}
.hero h2{margin:0;font-size:32px}.hero p{margin:8px 0 24px;color:#aebbd0;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stat{background:#fff;color:#667085;border-radius:28px;padding:27px 26px;min-height:126px}
.stat small{font-size:14px;font-weight:800}.stat b{display:block;color:#111827;font-size:27px;margin-top:15px}
.title{display:flex;justify-content:space-between;align-items:center;margin:34px 6px 17px}
.title h2{margin:0;font-size:22px}.title span{color:#667085;font-size:14px}
.menu{background:#fff;border:1px solid #e5e7eb;border-radius:30px;padding:28px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:25px 10px;box-shadow:0 8px 24px rgba(0,0,0,.045)}
.menu button{border:0;background:transparent;color:#111827;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 3px;border-radius:15px;cursor:pointer}
.menu button:hover{background:#f8fafc}
.icon{font-size:39px;line-height:1;height:45px;display:grid;place-items:center}
.menu span{font-size:15px;font-weight:800;text-align:center}
.loading{position:fixed;inset:0;background:#f4f5f7;display:grid;place-items:center;z-index:50;font-weight:800}
@media(max-width:600px){
.header{padding:23px 28px 72px;border-radius:0 0 30px 30px}
.logo{width:62px;height:62px;flex-basis:62px}
.brand h1{font-size:21px}.brand p{font-size:14px}
.logout{padding:11px 15px}
.content{padding:0 26px 40px;margin-top:-37px}
.hero{border-radius:38px;padding:30px 32px}
.hero h2{font-size:31px}.hero p{font-size:18px;line-height:1.35}
.stats{gap:18px}.stat{min-height:127px;padding:27px 25px}
.menu{grid-template-columns:repeat(3,1fr);padding:28px 12px;gap:26px 5px;border-radius:30px}
.icon{font-size:38px}
.menu span{font-size:14px}
}
@media(max-width:370px){
.content{padding:0 18px}.hero{padding:24px 22px}.hero h2{font-size:27px}
.stat{padding:22px 18px}.menu span{font-size:12px}
}
</style>
</head>
<body>
<div class="loading" id="loading">Memuat FIXZY BUSINESS...</div>
<div class="app">
<header class="header">
 <div class="brand">
  <div class="brand-left">
   <div class="logo"><img src="logofixzy.png" alt="FIXZY"></div>
   <div><h1>FIXZY BUSINESS</h1><p>Superadmin</p></div>
  </div>
  <button class="logout" id="logout">Keluar</button>
 </div>
</header>
<main class="content">
<section class="hero">
 <h2>Dashboard Superadmin</h2>
 <p>Kelola sistem FIXZY BUSINESS dari satu halaman.</p>
 <div class="stats">
  <div class="stat"><small>TOTAL OWNER</small><b id="ownerCount">0</b></div>
  <div class="stat"><small>TOP UP MENUNGGU</small><b id="topupCount">0</b></div>
 </div>
</section>
<div class="title"><h2>Menu Superadmin</h2><span>ADMIN SISTEM</span></div>
<section class="menu">
 <button onclick="location.href='admin-topup-fixzy-business.html'"><div class="icon">💰</div><span>Approval Top Up</span></button>
 <button onclick="location.href='data-owner.html'"><div class="icon">👥</div><span>Data Owner</span></button>
 <button onclick="location.href='approval-limit-fixzy-business-superadmin.html'"><div class="icon">💳</div><span>Kelola Limit</span></button>
 <button onclick="location.href='data-pesanan.html'"><div class="icon">🛒</div><span>Data Pesanan</span></button>
 <button onclick="location.href='tagihan.html'"><div class="icon">🧾</div><span>Tagihan</span></button>
 <button onclick="location.href='laporan.html'"><div class="icon">📊</div><span>Laporan Sistem</span></button>
 <button onclick="location.href='pengaturan.html'"><div class="icon">⚙️</div><span>Pengaturan</span></button>
</section>
</main>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
document.getElementById("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
 if(!user){location.href="index.html";return}
 try{
  const us=await getDoc(doc(db,"users",user.uid)); const p=us.exists()?us.data():{};
  if(p.role!=="superadmin"){location.href="index-owner-baru.html";return}
  const oq=query(collection(db,"users"),where("role","==","owner"));
  const os=await getDocs(oq); document.getElementById("ownerCount").textContent=os.size;
  const tq=query(collection(db,"walletTransactions"),where("type","==","TOPUP"),where("status","==","MENUNGGU"));
  const ts=await getDocs(tq); document.getElementById("topupCount").textContent=ts.size;
 }catch(e){console.error(e)}
 document.getElementById("loading").remove();
});
</script>
</body></html>
