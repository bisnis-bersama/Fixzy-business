<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Checkout | FIXZY BUSINESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#111;font-family:Arial,sans-serif}
.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:82px}
.top{background:#111;color:#fff;padding:18px 18px 76px;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-left{display:flex;align-items:center;gap:11px}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid #FFC107}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:17px;margin:0;color:#FFC107;font-weight:900}
.brand small{display:block;color:#ccc;margin-top:3px}
.back{color:#fff;text-decoration:none;border:1px solid #444;padding:9px 11px;border-radius:10px;font-size:12px}
.content{padding:0 15px;margin-top:-48px}
.panel{background:#fff;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 8px 24px #0000000d}
h2{font-size:16px;margin:0 0 13px}
.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:9px}
.itemtop{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:800;font-size:14px}
.meta{font-size:11px;color:#667085;margin-top:4px;line-height:1.45}
.price{font-weight:800;white-space:nowrap}
.qty{display:flex;align-items:center;gap:7px;margin-top:9px}
.qty button{border:1px solid #ddd;background:#f8f8f8;border-radius:8px;height:30px;padding:0 10px}
.qty span{min-width:25px;text-align:center;font-weight:bold}
.addr{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:13px;font-size:12px;line-height:1.5}
.addr b{font-size:14px}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}
.yellow{background:#FFC107;color:#111}
.light{background:#eef0f3}
.full{width:100%;margin-top:10px}
.pay{display:flex;gap:10px;align-items:center;border:0;border-bottom:1px solid #e5e7eb;border-radius:0;padding:12px 2px;margin:0;cursor:pointer}
.pay:last-of-type{border-bottom:0}
.pay input{width:20px;height:20px;margin:0;accent-color:#111;flex:none}
.pay.disabled{opacity:.55;background:transparent}.pay.disabled input{cursor:not-allowed}
.pay small{display:block;color:#667085;margin-top:3px}
.row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.total{border-top:1px solid #eee;margin-top:7px;padding-top:12px;font-size:17px;font-weight:900}
.msg{padding:12px;border-radius:12px;margin-bottom:12px;font-size:12px}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.err{background:#fee2e2;color:#991b1b}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav{border:0;background:transparent;color:#FFC107;font-size:10px;font-weight:800}
.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}
.modal.show{display:flex}
.box{background:#fff;width:min(560px,100%);margin:auto;border-radius:24px 24px 0 0;padding:20px}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}
input,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font:inherit}
textarea{min-height:90px}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">
<div class="brand-left">
<div class="logo"><img src="logofixzy.png" alt="FIXZY BUSINESS"></div>
<div><h1>FIXZY BUSINESS</h1><small>Checkout</small></div>
</div>
<a class="back" href="produk.html">← Belanja</a>
</div>
</header>

<main class="content">
<div id="msg"></div>

<section class="panel">
<h2>Pesanan</h2>
<div id="items"></div>
</section>

<section class="panel">
<h2>Alamat Pengiriman</h2>
<div id="addr"></div>
<button class="btn yellow full" id="gpsBtn" type="button">📍 Gunakan Lokasi Saya</button>
<div id="gpsResult" style="display:none;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;line-height:1.5"></div>
<button class="btn light full" id="addrBtn">Ubah Alamat</button>
</section>

<section class="panel">
<h2>Metode Pembayaran</h2>
<label class="pay">
<input type="radio" name="pay" value="SALDO_PRIBADI" checked>
<div><b>Saldo Pribadi</b><small id="saldo">Memuat...</small></div>
</label>
<label class="pay">
<input type="radio" name="pay" value="LIMIT">
<div><b>Limit / Tempo</b><small id="limit">Memuat...</small><small id="limitRule">Minimal 3 pcs untuk Limit / Tempo.</small></div>
</label>
<small id="tempoInfo" style="display:block;color:#667085;margin-top:8px">Saldo atau limit baru dipotong setelah pesanan disetujui Superadmin.</small>
</section>

<section class="panel">
<h2>Ringkasan</h2>
<div class="row"><span>Total Barang</span><b id="qty">0 pcs</b></div>
<div class="row total"><span>Total</span><span id="total">Rp0</span></div>
<button class="btn yellow full" id="order">Buat Pesanan</button>
</section>
</main>
</div>

<nav class="bottom">
<button class="nav" onclick="location.href='index.html'"><i>⌂</i>Beranda</button>
<button class="nav" onclick="location.href='produk.html'"><i>🛒</i>Belanja</button>
<button class="nav" onclick="location.href='tagihan.html'"><i>🧾</i>Tagihan</button>
<button class="nav" onclick="location.href='riwayat.html'"><i>↔</i>Riwayat</button>
<button class="nav" onclick="location.href='profil.html'"><i>👤</i>Profil</button>
</nav>

<div class="modal" id="modal">
<div class="box">
<h2>Alamat Pengiriman</h2>
<label>Nama Penerima</label><input id="an" placeholder="Nama penerima">
<label>No. HP</label><input id="ap" placeholder="08xxxxxxxxxx">
<label>Alamat Lengkap</label><textarea id="aa" placeholder="Nama jalan, nomor rumah/toko, blok, RT/RW, desa/kelurahan, kecamatan, kabupaten/kota, provinsi, kode pos"></textarea>
<label>Petunjuk Lokasi (opsional)</label>
<input id="apetunjuk" placeholder="Contoh: depan pasar, samping masjid, dekat toko...">
<div class="actions">
<button class="btn light" id="cancel">Batal</button>
<button class="btn yellow" id="save">Simpan</button>
</div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
authDomain:"teknisi-ponsel-maja.firebaseapp.com",
projectId:"teknisi-ponsel-maja",
storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
messagingSenderId:"835618012205",
appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);

// Angka dari Spreadsheet bisa berbentuk Indonesia, misalnya "109.360".
// Number("109.360") dibaca JavaScript sebagai 109, sehingga harus dinormalisasi dulu.
function parseMoney(value){
  if(value===null || value===undefined) return 0;
  const raw=String(value).trim();
  if(!raw) return 0;
  let s=raw.replace(/Rp/gi,"").replace(/\s/g,"");
  s=s.replace(/[^0-9,.-]/g,"");
  if(!s) return 0;

  if(s.includes(".") && s.includes(",")){
    s=s.replace(/\./g,"").replace(",",".");
  }else if(s.includes(".")){
    const parts=s.split(".");
    // 109.360 = 109360, bukan 109.36
    if(parts.length>2 || (parts.length===2 && parts[1].length===3)) s=s.replace(/\./g,"");
  }else if(s.includes(",")){
    const parts=s.split(",");
    if(parts.length>2 || (parts.length===2 && parts[1].length===3)) s=s.replace(/,/g,"");
    else s=s.replace(",",".");
  }
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));

let user=null,cart=[],saldo=0,limit=0,address=null,total=0,totalQty=0,tempoHari=0;

function cartKey(){return"fixzy_cart_"+user.uid}
function saveCart(){localStorage.setItem(cartKey(),JSON.stringify(cart))}
function getPrice(x,method){
const raw=method==="LIMIT"
?(x.hargaTempo??x.tempo??x.harga_tempo??x.priceTempo??0)
:(x.hargaCash??x.hargaTunai??x.tunai??x.cash??x.harga??0);
return parseMoney(raw);
}
function getTempoHari(qty){
if(qty>=10) return 30;
if(qty>=5) return 15;
if(qty>=3) return 7;
return 0;
}

function tempoLabel(qty){
const d=getTempoHari(qty);
if(d===30) return "Tempo 30 hari (minimal 10 pcs)";
if(d===15) return "Tempo 15 hari (minimal 5 pcs)";
if(d===7) return "Tempo 7 hari (minimal 3 pcs)";
return "Tempo tersedia mulai minimal 3 pcs";
}

function message(type,text){$("msg").innerHTML=`<div class="msg ${type}">${esc(text)}</div>`}

function render(){
const method=document.querySelector("[name=pay]:checked")?.value||"SALDO_PRIBADI";
total=0;totalQty=0;

if(!cart.length){
$("items").innerHTML="<div style='text-align:center;color:#667085;padding:20px'>Keranjang kosong.</div>";
$("order").disabled=true;
}else{
$("order").disabled=false;
$("items").innerHTML=cart.map((x,i)=>{
const q=Math.max(1,Number(x.qty)||1);
const p=getPrice(x,method);
const sub=p*q;
total+=sub;totalQty+=q;
return `<div class="item">
<div class="itemtop">
<div><div class="name">${esc(x.nama??x.name??x.produk??"-")}</div>
<div class="meta">Kode: ${esc(x.kode??"-")}<br>Supplier: ${esc(x.supplier??"-")}<br>${rupiah(p)} / pcs</div></div>
<div class="price">${rupiah(sub)}</div>
</div>
<div class="qty">
<button data-minus="${i}">−</button><span>${q}</span><button data-plus="${i}">+</button>
<button data-remove="${i}" style="margin-left:5px">Hapus</button>
</div>
</div>`;
}).join("");
}

$("qty").textContent=totalQty+" pcs";
$("total").textContent=rupiah(total);
tempoHari=getTempoHari(totalQty);

const limitRadio=document.querySelector('input[name="pay"][value="LIMIT"]');
const limitPay=limitRadio?.closest(".pay");
const limitRule=$("limitRule");
const limitAllowed=totalQty>=3;
if(limitRadio){
  limitRadio.disabled=!limitAllowed;
  if(limitPay) limitPay.classList.toggle("disabled",!limitAllowed);
  if(limitRule) limitRule.textContent=limitAllowed ? tempoLabel(totalQty) : "Minimal 3 pcs untuk Limit / Tempo.";
  if(!limitAllowed && limitRadio.checked){
    document.querySelector('input[name="pay"][value="SALDO_PRIBADI"]').checked=true;
  }
}
const payMethod=document.querySelector("[name=pay]:checked")?.value||"SALDO_PRIBADI";
if(payMethod==="LIMIT"){
  $("tempoInfo").textContent=tempoHari
    ? tempoLabel(totalQty)+". Jatuh tempo dihitung dari saat pesanan disetujui."
    : "Limit / Tempo minimal 3 pcs. 3–4 pcs = 7 hari, 5–9 pcs = 15 hari, minimal 10 pcs = 30 hari.";
}else{
  $("tempoInfo").textContent="Saldo atau limit baru dipotong setelah pesanan disetujui Superadmin.";
}

document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{
const i=Number(b.dataset.minus);
cart[i].qty=Math.max(1,(Number(cart[i].qty)||1)-1);
saveCart();render();
});
document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{
const i=Number(b.dataset.plus);
cart[i].qty=(Number(cart[i].qty)||1)+1;
saveCart();render();
});
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
cart.splice(Number(b.dataset.remove),1);
saveCart();render();
});
}

function renderAddress(){
if(!address){
$("addr").innerHTML="<div style='color:#667085;font-size:12px'>Belum ada alamat pengiriman.</div>";
$("addrBtn").textContent="+ Tambah Alamat";
return;
}
$("addr").innerHTML=`<div class="addr"><b>${esc(address.nama)}</b><br>${esc(address.telepon)}<br>${esc(address.alamat)}</div>`;
$("addrBtn").textContent="Ubah Alamat";
}

function openAddress(){
$("an").value=address?.nama||"";
$("ap").value=address?.telepon||"";
$("aa").value=address?.alamat||"";
$("apetunjuk").value=address?.petunjuk||"";
$("modal").classList.add("show");
}

async function useMyLocation(){
  const btn=$("gpsBtn");
  const result=$("gpsResult");

  if(!navigator.geolocation){
    message("warn","GPS/lokasi tidak didukung oleh browser ini.");
    return;
  }

  btn.disabled=true;
  btn.textContent="📍 Mencari lokasi...";
  result.style.display="block";
  result.innerHTML="Mengambil titik lokasi dan alamat lengkap...";

  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      const accuracy=Math.round(pos.coords.accuracy||0);

      const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1&accept-language=id`;
      const response=await fetch(url);
      if(!response.ok) throw new Error("Gagal mengambil alamat.");

      const data=await response.json();
      const a=data.address||{};

      const jalan=a.road||a.pedestrian||a.residential||a.path||"";
      const nomor=a.house_number||"";
      const desa=a.village||a.suburb||a.neighbourhood||a.hamlet||"";
      const kecamatan=a.suburb||a.town||a.municipality||a.city_district||"";
      const kota=a.city||a.town||a.municipality||a.county||"";
      const provinsi=a.state||"";
      const kodepos=a.postcode||"";
      const negara=a.country||"Indonesia";

      // Bentuk alamat yang lebih layak untuk pengiriman.
      const parts=[
        jalan && (nomor ? `${jalan} No. ${nomor}` : jalan),
        desa && `Desa/Kel. ${desa}`,
        kecamatan && `Kec. ${kecamatan}`,
        kota,
        provinsi,
        kodepos
      ].filter(Boolean);

      const alamatOtomatis=parts.join(", ") || data.display_name || "";
      if(!alamatOtomatis) throw new Error("Alamat tidak ditemukan.");

      address={
        nama:address?.nama||"",
        telepon:address?.telepon||"",
        alamat:alamatOtomatis,
        petunjuk:address?.petunjuk||"",
        latitude:lat,
        longitude:lon,
        akurasiGPS:accuracy,
        sumber:"GPS"
      };

      await setDoc(doc(db,"users",user.uid),{alamatPengiriman:address},{merge:true});
      renderAddress();

      result.innerHTML=
        `<b>📍 Lokasi ditemukan</b>
        ${esc(alamatOtomatis)}
        <br><span style="color:#667085">Akurasi GPS ±${accuracy} meter</span>
        <br><a href="https://www.google.com/maps?q=${lat.toFixed(6)},${lon.toFixed(6)}" target="_blank" rel="noopener noreferrer" style="color:#1677ff;text-decoration:underline;font-weight:700">📍 Buka Koordinat di Google Maps</a>
        <br><small style="color:#667085">Untuk pengiriman ke rumah/toko, pastikan nomor rumah dan RT/RW sudah benar melalui tombol Ubah Alamat.</small>`;

      message("ok","Lokasi GPS berhasil digunakan. Lengkapi nomor rumah/RT/RW bila belum terdeteksi.");
    }catch(e){
      console.error(e);
      result.innerHTML="Alamat otomatis belum lengkap. Silakan gunakan tombol Ubah Alamat untuk melengkapinya.";
      message("err","Gagal mengambil alamat otomatis.");
    }finally{
      btn.disabled=false;
      btn.textContent="📍 Gunakan Lokasi Saya";
    }
  },err=>{
    btn.disabled=false;
    btn.textContent="📍 Gunakan Lokasi Saya";
    result.style.display="block";
    result.textContent=err.code===1
      ?"Izin lokasi ditolak. Aktifkan izin lokasi di browser."
      :"GPS tidak dapat menentukan lokasi. Pastikan GPS aktif lalu coba lagi.";
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
$("gpsBtn").onclick=useMyLocation;
document.querySelectorAll("[name=pay]").forEach(r=>r.onchange=render);
$("addrBtn").onclick=openAddress;
$("cancel").onclick=()=>$("modal").classList.remove("show");

$("save").onclick=async()=>{
const a={
nama:$("an").value.trim(),
telepon:$("ap").value.trim(),
alamat:$("aa").value.trim(),
petunjuk:$("apetunjuk").value.trim()
};
if(!a.nama||!a.telepon||!a.alamat){
message("warn","Nama, nomor HP, dan alamat wajib diisi.");
return;
}
try{
await setDoc(doc(db,"users",user.uid),{alamatPengiriman:a},{merge:true});
address=a;
renderAddress();
$("modal").classList.remove("show");
message("ok","Alamat pengiriman berhasil disimpan.");
}catch(e){
console.error(e);
message("err","Alamat gagal disimpan.");
}
};

$("order").onclick=async()=>{
if(!cart.length){message("warn","Keranjang masih kosong.");return}
if(!address){message("warn","Tambahkan alamat pengiriman terlebih dahulu.");return}

const method=document.querySelector("[name=pay]:checked").value;
render();

if(method==="SALDO_PRIBADI"&&total>saldo){
message("warn","Saldo Pribadi tidak mencukupi.");
return;
}
if(method==="LIMIT"&&total>limit){
message("warn","Limit tersedia tidak mencukupi.");
return;
}
if(method==="LIMIT"&&totalQty<3){
message("warn","Pembelian dengan Limit / Tempo minimal 3 pcs.");
return;
}
tempoHari=method==="LIMIT" ? getTempoHari(totalQty) : 0;

const button=$("order");
button.disabled=true;
button.textContent="Mengirim Pesanan...";

try{
const nomor="ORD-"+Date.now().toString(36).toUpperCase()+"-"+Math.floor(100+Math.random()*900);

const items=cart.map(x=>{
const qty=Math.max(1,Number(x.qty)||1);
const harga=getPrice(x,method);
return{
produkId:x.produkId??x.id??"",
nama:String(x.nama??x.name??x.produk??"-"),
kode:String(x.kode??""),
supplier:String(x.supplier??""),
qty,
harga,
subtotal:harga*qty,
stokSaatPesan:Number(x.stok??x.sisa??0)||0,
sourceSpreadsheet:x.sourceSpreadsheet??""
};
});

await addDoc(collection(db,"orders"),{
ownerUid:user.uid,
nomorPesanan:nomor,
items,
total:Number(total),
totalQty:Number(totalQty),
metodePembayaran:method,
tempoHari:Number(tempoHari),
alamatPengiriman:{...address},
status:"MENUNGGU_PERSETUJUAN",
createdAt:serverTimestamp()
});

localStorage.removeItem(cartKey());
cart=[];
render();
button.textContent="Pesanan Dibuat";
message("ok","Pesanan "+nomor+" berhasil dibuat dan menunggu persetujuan Superadmin.");
window.scrollTo({top:0,behavior:"smooth"});
}catch(e){
console.error(e);
message("err","Pesanan gagal dibuat: "+e.message);
button.disabled=false;
button.textContent="Buat Pesanan";
}
};

onAuthStateChanged(auth,async u=>{
if(!u){location.href="index.html";return}
user=u;

try{
const[w,l,p]=await Promise.all([
getDoc(doc(db,"wallets",u.uid)),
getDoc(doc(db,"limits",u.uid)),
getDoc(doc(db,"users",u.uid))
]);

saldo=w.exists()?Number(w.data().saldoPribadi||0):0;
limit=l.exists()?Number(l.data().limitTersedia||0):0;
address=p.exists()?(p.data().alamatPengiriman||null):null;

$("saldo").textContent="Tersedia "+rupiah(saldo);
$("limit").textContent="Tersedia "+rupiah(limit);

try{cart=JSON.parse(localStorage.getItem(cartKey())||"[]")}catch(e){cart=[]}
if(!Array.isArray(cart))cart=[];

renderAddress();
render();
}catch(e){
console.error(e);
message("err","Gagal memuat data checkout.");
}
});
</script>
</body>
</html>
