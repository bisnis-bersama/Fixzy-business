<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrasi Owner | FIXZY BUSINESS</title><style>
:root{--yellow:#ffc107;--black:#111;--bg:#f3f4f6;--white:#fff;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.header{background:#111;color:#fff;padding:18px 18px 22px;border-radius:0 0 30px 30px;position:sticky;top:0;z-index:5}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:14px;object-fit:contain;background:#111;border:1px solid var(--yellow);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand h1{font-size:17px;margin:0;color:var(--yellow);font-weight:900}.brand small{color:#bbb}
.container{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.hero{background:#111;color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.hero small{color:#ccc}.hero strong{display:block;font-size:28px;margin-top:8px;color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8f8f8;border-radius:13px;padding:14px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{display:block;margin-top:7px;font-size:18px}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:700;cursor:pointer}.btn.yellow{background:var(--yellow);color:#111}.btn.light{background:#eee;color:#111}.btn.red{background:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:15px}
label{font-size:13px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom a{max-width:none;flex:1;padding:3px;text-align:center;text-decoration:none;color:var(--yellow);font-size:10px;font-weight:800}.bottom a.active{color:var(--yellow);font-weight:900}
.note{font-size:12px;color:var(--muted);line-height:1.5}.back{display:block;text-align:center;color:#555;text-decoration:none;margin-top:15px}
.list{display:flex;flex-direction:column;gap:10px}.item{padding:13px;border:1px solid var(--border);border-radius:12px;background:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr 1fr}.container{padding:12px}}
</style></head><body>
<header class="header"><div class="header-inner"><div class="brand"><img class="logo" src="logofixzy.png" onerror="this.style.display='none'"><div><h1>FIXZY BUSINESS</h1><small>Registrasi Owner</small></div></div><a href="index.html" style="color:#fff;text-decoration:none">⌂</a></div></header>
<main class="container">
<section class="card"><h2>Daftar Owner</h2>
<div id="message" class="note" style="display:none;margin-bottom:12px;padding:11px;border-radius:11px;font-weight:700"></div>

<label for="nama">Nama</label>
<input id="nama" autocomplete="name" placeholder="Nama lengkap">

<label for="namaUsaha">Nama Usaha</label>
<input id="namaUsaha" autocomplete="organization" placeholder="Nama usaha">

<label for="noWhatsApp">No. WhatsApp</label>
<input id="noWhatsApp" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx">

<label for="email">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="email">

<label for="password">Password</label>
<input id="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter">

<label for="password2">Ulangi Password</label>
<input id="password2" type="password" autocomplete="new-password" placeholder="Ulangi password">

<button id="btnDaftar" class="btn yellow" type="button">DAFTAR OWNER</button>
<p class="note" style="margin-top:12px">Akun Owner akan dibuat menggunakan Firebase Authentication dan data Owner disimpan di Firestore.</p>
<p class="note" style="margin-top:8px">Sudah punya akun? <a href="index.html" style="color:#111;font-weight:900">Kembali ke halaman login</a>.</p>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain: "teknisi-ponsel-maja.firebaseapp.com",
  projectId: "teknisi-ponsel-maja",
  storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId: "835618012205",
  appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

function normalizePhone(v){
  let s = String(v || "").replace(/\D/g,"");
  if(s.startsWith("0")) s = "62" + s.slice(1);
  return s;
}

function showMessage(text, ok=false){
  const el = $("message");
  el.textContent = text;
  el.style.display = "block";
  el.style.background = ok ? "#dcfce7" : "#fee2e2";
  el.style.color = ok ? "#166534" : "#991b1b";
}

$("btnDaftar").addEventListener("click", async () => {
  const nama = $("nama").value.trim();
  const namaUsaha = $("namaUsaha").value.trim();
  const noWhatsApp = $("noWhatsApp").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const password2 = $("password2").value;

  if(!nama || !namaUsaha || !noWhatsApp || !email || !password || !password2){
    showMessage("Semua data wajib diisi.");
    return;
  }

  if(password.length < 6){
    showMessage("Password minimal 6 karakter.");
    return;
  }

  if(password !== password2){
    showMessage("Ulangi password tidak sama.");
    return;
  }

  const normalizedPhone = normalizePhone(noWhatsApp);
  if(normalizedPhone.length < 10){
    showMessage("Nomor WhatsApp tidak valid.");
    return;
  }

  const btn = $("btnDaftar");
  btn.disabled = true;
  btn.textContent = "MEMPROSES...";

  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    await updateProfile(cred.user, { displayName: nama });

    await setDoc(doc(db, "users", uid), {
      uid,
      ownerUid: uid,
      role: "owner",
      nama,
      namaUsaha,
      noWhatsApp,
      whatsapp: noWhatsApp,
      noWhatsAppNormalized: normalizedPhone,
      email,
      status: "aktif",
      createdAt: serverTimestamp()
    });

    showMessage("Registrasi Owner berhasil. Silakan masuk menggunakan email dan password yang baru dibuat.", true);

    setTimeout(() => {
      location.href = "index.html";
    }, 1200);

  }catch(err){
    console.error(err);
    let msg = "Registrasi gagal.";

    if(err.code === "auth/email-already-in-use"){
      msg = "Email tersebut sudah terdaftar. Silakan masuk menggunakan akun yang sudah ada.";
    }else if(err.code === "auth/invalid-email"){
      msg = "Format email tidak valid.";
    }else if(err.code === "auth/weak-password"){
      msg = "Password terlalu lemah. Gunakan minimal 6 karakter.";
    }else if(err.code === "permission-denied"){
      msg = "Registrasi ditolak oleh aturan Firestore. Periksa Firebase Rules.";
    }else if(err.message){
      msg = err.message;
    }

    showMessage(msg);
    btn.disabled = false;
    btn.textContent = "DAFTAR OWNER";
  }
});
</script></body></html>
