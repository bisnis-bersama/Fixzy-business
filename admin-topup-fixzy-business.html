<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>Superadmin | Top Up FIXZY BUSINESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#101828;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.page{max-width:720px;margin:auto;min-height:100vh;padding-bottom:35px}
.header{background:#0b1426;color:#fff;padding:18px 18px 25px;border-radius:0 0 28px 28px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h1{font-size:20px;margin:0}.head small{color:#aeb9ca}
.back{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:11px;padding:10px 13px;font-weight:800}
.content{padding:0 15px;margin-top:-6px}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:20px;margin-top:15px;padding:16px;box-shadow:0 7px 22px rgba(15,23,42,.05)}
.title{font-weight:900;font-size:15px}.muted{font-size:12px;color:#667085}
.item{border:1px solid #e4e7ec;border-radius:16px;padding:14px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.amount{font-size:20px;font-weight:900}.name{font-weight:850}.meta{font-size:11px;color:#667085;line-height:1.55;margin-top:4px}
.badge{font-size:10px;font-weight:900;border-radius:999px;padding:6px 8px;background:#fff7ed;color:#b54708}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{font:inherit;cursor:pointer}.approve,.reject{border:0;border-radius:11px;padding:11px;font-weight:900}
.approve{background:#0b1426;color:#fff}.reject{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:25px 10px;color:#667085;font-size:12px}
.msg{font-size:12px;margin-top:10px;line-height:1.5}.error{color:#b42318}.success{color:#15803d}
.refresh{border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:8px 11px;font-weight:800}
</style>
</head>
<body>
<div class="page">
<header class="header">
  <div class="head">
    <div>
      <h1>Superadmin</h1>
      <small>Verifikasi Top Up FIXZY BUSINESS</small>
    </div>
    <button class="back" onclick="location.href='index.html'">Dashboard</button>
  </div>
</header>

<main class="content">
  <section class="card">
    <div class="row">
      <div>
        <div class="title">Pengajuan Top Up</div>
        <div class="muted" id="count">Memuat...</div>
      </div>
      <button class="refresh" id="refresh">Refresh</button>
    </div>
    <div id="list"><div class="empty">Memuat data...</div></div>
    <div class="msg" id="msg"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore,collection,query,where,getDocs,doc,getDoc,
  runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain:"teknisi-ponsel-maja.firebaseapp.com",
  projectId:"teknisi-ponsel-maja",
  storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId:"835618012205",
  appId:"1:835618012205:web:95d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null;

const $=id=>document.getElementById(id);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function isSuperadmin(){
  const result=await currentUser.getIdTokenResult(true);
  return result.claims.role==="superadmin";
}

async function load(){
  $("msg").textContent="";
  const q=query(collection(db,"walletTransactions"),where("type","==","TOPUP"),where("status","==","MENUNGGU"));
  const snap=await getDocs(q);

  $("count").textContent=`${snap.size} pengajuan menunggu verifikasi`;
  if(snap.empty){
    $("list").innerHTML='<div class="empty">Tidak ada pengajuan top up.</div>';
    return;
  }

  const rows=[];
  snap.forEach(d=>rows.push({id:d.id,...d.data()}));
  rows.sort((a,b)=>{
    const ta=a.createdAt?.toMillis?a.createdAt.toMillis():0;
    const tb=b.createdAt?.toMillis?b.createdAt.toMillis():0;
    return tb-ta;
  });

  $("list").innerHTML="";
  rows.forEach(x=>{
    const dt=x.createdAt?.toDate?x.createdAt.toDate().toLocaleString("id-ID"):"Baru saja";
    $("list").insertAdjacentHTML("beforeend",`
      <div class="item" id="item-${esc(x.id)}">
        <div class="row">
          <div>
            <div class="name">${esc(x.namaUsaha||"Owner")}</div>
            <div class="amount">${rupiah(x.nominal)}</div>
            <div class="meta">
              UID: ${esc(x.ownerUid)}<br>
              Metode: ${esc(x.metode||"-")}<br>
              Referensi: ${esc(x.referensi||"-")}<br>
              Diajukan: ${esc(dt)}
            </div>
          </div>
          <span class="badge">MENUNGGU</span>
        </div>
        <div class="actions">
          <button class="approve" data-id="${esc(x.id)}">SETUJUI</button>
          <button class="reject" data-id="${esc(x.id)}">TOLAK</button>
        </div>
      </div>`);
  });

  document.querySelectorAll(".approve").forEach(b=>b.onclick=()=>processTopup(b.dataset.id,true));
  document.querySelectorAll(".reject").forEach(b=>b.onclick=()=>processTopup(b.dataset.id,false));
}

async function processTopup(id,approve){
  const item=$(`item-${id}`);
  if(!item)return;
  const buttons=item.querySelectorAll("button");
  buttons.forEach(b=>b.disabled=true);

  try{
    await runTransaction(db,async tx=>{
      const txRef=doc(db,"walletTransactions",id);
      const txSnap=await tx.get(txRef);

      if(!txSnap.exists())throw new Error("TRANSAKSI_TIDAK_ADA");
      const data=txSnap.data();

      if(data.type!=="TOPUP" || data.status!=="MENUNGGU"){
        throw new Error("TRANSAKSI_SUDAH_DIPROSES");
      }

      if(!approve){
        tx.update(txRef,{
          status:"DITOLAK",
          verifiedBy:currentUser.uid,
          verifiedAt:serverTimestamp()
        });
        return;
      }

      const ownerUid=data.ownerUid;
      const nominal=Number(data.nominal)||0;
      if(nominal<=0)throw new Error("NOMINAL_TIDAK_VALID");

      const walletRef=doc(db,"wallets",ownerUid);
      const walletSnap=await tx.get(walletRef);
      const wallet=walletSnap.exists()?walletSnap.data():{};
      const sebelum=Number(wallet.saldoPribadi)||0;
      const sesudah=sebelum+nominal;

      if(walletSnap.exists()){
        tx.update(walletRef,{
          saldoPribadi:sesudah,
          ownerUid,
          updatedAt:serverTimestamp()
        });
      }else{
        tx.set(walletRef,{
          ownerUid,
          saldoPribadi:sesudah,
          status:"AKTIF",
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
      }

      tx.update(txRef,{
        status:"DISETUJUI",
        saldoSebelum:sebelum,
        saldoSesudah:sesudah,
        verifiedBy:currentUser.uid,
        verifiedAt:serverTimestamp()
      });
    });

    $("msg").className="msg success";
    $("msg").textContent=approve?"Top up disetujui. Saldo Owner sudah bertambah.":"Pengajuan top up ditolak.";
    await load();

  }catch(err){
    console.error(err);
    $("msg").className="msg error";
    $("msg").textContent="Gagal memproses: "+err.message;
    buttons.forEach(b=>b.disabled=false);
  }
}

$("refresh").onclick=load;

onAuthStateChanged(auth,async user=>{
  if(!user){location.href="index.html";return}
  currentUser=user;
  try{
    if(!(await isSuperadmin())){
      $("list").innerHTML='<div class="empty">Akun ini bukan Superadmin.</div>';
      return;
    }
    await load();
  }catch(err){
    console.error(err);
    $("list").innerHTML='<div class="empty">Gagal memuat data.</div>';
  }
});
</script>
</body>
</html>
