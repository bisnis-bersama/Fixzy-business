<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY BUSINESS | Verifikasi Top Up</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#101828;font-family:Arial,sans-serif}
.header{background:#07152b;color:#fff;padding:24px 18px 28px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:58px;border-radius:16px;object-fit:cover;background:#fff}
.brand h1{font-size:22px;margin:0}.brand p{margin:5px 0 0;color:#aab6c8;font-size:13px}
.wrap{max-width:720px;margin:auto;padding-bottom:40px}
.card{background:#fff;border-radius:20px;margin:16px;padding:18px;box-shadow:0 5px 22px #10182812}
.title{font-size:17px;font-weight:800;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f8fafc;border-radius:14px;padding:13px}.stat small{color:#667085}.stat b{display:block;font-size:20px;margin-top:5px}
.item{border:1px solid #eaecf0;border-radius:16px;padding:15px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px}.amount{font-size:19px;font-weight:800}
.muted{color:#667085;font-size:12px;line-height:1.55}
.badge{background:#fff4e5;color:#b54708;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:800;height:max-content}
.detail{background:#f8fafc;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px}
.approve{background:#12b76a;color:#fff}.reject{background:#fee4e2;color:#b42318}
.empty{text-align:center;color:#667085;padding:28px 10px}
.msg{padding:11px 13px;border-radius:12px;font-size:12px;margin-top:10px;display:none}
.success{display:block;background:#ecfdf3;color:#027a48}.error{display:block;background:#fef3f2;color:#b42318}
.login{padding:18px}.login input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;margin:6px 0 10px;font-size:15px}
.login button{width:100%;background:#07152b;color:#fff}
.logout{float:right;background:#fff2;color:#fff;border:1px solid #ffffff44;padding:9px 12px}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header class="header">
  <button class="logout" id="logout">Keluar</button>
  <div class="brand">
    <img src="logofixzy.png" onerror="this.style.display='none'">
    <div><h1>FIXZY BUSINESS</h1><p>Superadmin • Verifikasi Top Up</p></div>
  </div>
</header>

<section class="card" id="loginCard">
  <div class="title">Masuk Superadmin</div>
  <div class="muted">Gunakan akun Firebase yang pada data <b>users/{UID}</b> memiliki <b>role = superadmin</b>.</div>
  <div class="login">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login">Masuk</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</section>

<main id="app" style="display:none">
  <section class="card">
    <div class="title">Ringkasan</div>
    <div class="stats">
      <div class="stat"><small>Menunggu</small><b id="count">0</b></div>
      <div class="stat"><small>Total Pengajuan</small><b id="total">Rp0</b></div>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card">
    <div class="title">Top Up Menunggu Verifikasi</div>
    <div id="list"><div class="empty">Memuat...</div></div>
  </section>
</main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,doc,getDoc,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
 authDomain:"teknisi-ponsel-maja.firebaseapp.com",
 projectId:"teknisi-ponsel-maja",
 storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
 messagingSenderId:"835618012205",
 appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);

function showMsg(text,type="success"){
 const el=$("msg");el.className="msg "+type;el.textContent=text;
}
function showLoginMsg(text,type="error"){
 const el=$("loginMsg");el.className="msg "+type;el.textContent=text;
}

async function verifySuperadmin(user){
 const userSnap = await getDoc(doc(db,"users",user.uid));
 if(!userSnap.exists()) return false;

 const profile = userSnap.data() || {};
 return profile.role === "superadmin";
}

$("login").onclick=async()=>{
 try{
   const email=$("email").value.trim(),password=$("password").value;
   if(!email||!password) throw new Error("Email dan password wajib diisi.");
   const cred=await signInWithEmailAndPassword(auth,email,password);
   if(!(await verifySuperadmin(cred.user))){
     await signOut(auth);
     throw new Error("Akun ini bukan Superadmin.");
   }
 }catch(e){showLoginMsg(e.message||"Login gagal.");}
};

$("logout").onclick=()=>signOut(auth);

function formatDate(ts){
 return ts?.toDate ? ts.toDate().toLocaleString("id-ID") : "-";
}

async function loadTopups(){
 $("list").innerHTML='<div class="empty">Memuat data...</div>';
 const q=query(collection(db,"walletTransactions"),where("type","==","TOPUP"),where("status","==","MENUNGGU"));
 const snap=await getDocs(q);
 const rows=[];
 snap.forEach(d=>rows.push({id:d.id,...d.data()}));
 rows.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));

 $("count").textContent=rows.length;
 $("total").textContent=rupiah(rows.reduce((s,x)=>s+(Number(x.nominal)||0),0));

 if(!rows.length){
   $("list").innerHTML='<div class="empty">Tidak ada Top Up yang menunggu verifikasi.</div>';
   return;
 }

 $("list").innerHTML="";
 rows.forEach(x=>{
   const el=document.createElement("div");
   el.className="item";
   el.innerHTML=`
    <div class="row">
      <div>
        <div class="amount">${rupiah(x.nominal)}</div>
        <div class="muted">${formatDate(x.createdAt)} • ${x.metode||"-"}</div>
      </div>
      <span class="badge">MENUNGGU</span>
    </div>
    <div class="detail">
      Owner UID: ${x.ownerUid||"-"}<br>
      Kode unik: <b>${x.kodeUnik||"-"}</b><br>
      Total transfer: <b>${rupiah(x.totalTransfer || ((Number(x.nominal)||0)+(Number(x.kodeUnik)||0)))}</b><br>
      Referensi: ${x.referensi||"-"}
    </div>
    <div class="actions">
      <button class="approve">SETUJUI</button>
      <button class="reject">TOLAK</button>
    </div>`;
   el.querySelector(".approve").onclick=()=>processTopup(x,true,el);
   el.querySelector(".reject").onclick=()=>processTopup(x,false,el);
   $("list").appendChild(el);
 });
}

async function processTopup(x,approved,el){
 if(!confirm(approved ? "Setujui Top Up ini? Saldo Owner akan bertambah sesuai nominal Top Up." : "Tolak Top Up ini?")) return;
 const btns=el.querySelectorAll("button");btns.forEach(b=>b.disabled=true);

 try{
   await runTransaction(db,async(tx)=>{
     const txRef=doc(db,"walletTransactions",x.id);
     const txSnap=await tx.get(txRef);
     if(!txSnap.exists()) throw new Error("Transaksi tidak ditemukan.");
     const current=txSnap.data();
     if(current.status!=="MENUNGGU") throw new Error("Transaksi sudah diproses.");

     if(!approved){
       tx.update(txRef,{
         status:"DITOLAK",
         verifiedBy:auth.currentUser.uid,
         verifiedAt:serverTimestamp()
       });
       return;
     }

     const walletRef=doc(db,"wallets",x.ownerUid);
     const walletSnap=await tx.get(walletRef);
     const walletData=walletSnap.exists() ? (walletSnap.data() || {}) : {};
     const oldBalance=Number(walletData.saldoPribadi ?? walletData.saldo ?? 0) || 0;
     const add=Number(current.nominal)||0;
     const newBalance=oldBalance+add;

     if(walletSnap.exists()){
       tx.update(walletRef,{
         saldo:newBalance,
         saldoPribadi:newBalance,
         ownerUid:x.ownerUid,
         updatedAt:serverTimestamp()
       });
     }else{
       tx.set(walletRef,{
         ownerUid:x.ownerUid,
         saldo:newBalance,
         saldoPribadi:newBalance,
         status:"AKTIF",
         updatedAt:serverTimestamp()
       });
     }

     tx.update(txRef,{
       status:"DISETUJUI",
       saldoSebelum:oldBalance,
       saldoSesudah:newBalance,
       verifiedBy:auth.currentUser.uid,
       verifiedAt:serverTimestamp()
     });
   });

   showMsg(approved ? "Top Up disetujui dan saldo Owner sudah ditambahkan." : "Top Up ditolak.");
   await loadTopups();
 }catch(e){
   btns.forEach(b=>b.disabled=false);
   showMsg(e.message||"Proses gagal.","error");
 }
}

onAuthStateChanged(async user=>{
 if(!user){
   $("app").style.display="none";
   $("loginCard").style.display="block";
   return;
 }
 try{
   if(await verifySuperadmin(user)){
     $("loginCard").style.display="none";
     $("app").style.display="block";
     await loadTopups();
   }else{
     await signOut(auth);
     showLoginMsg("Akun ini bukan Superadmin.");
   }
 }catch(e){
   await signOut(auth);
   showLoginMsg(e.message||"Akses Superadmin gagal.");
 }
});
</script>
</body>
</html>
