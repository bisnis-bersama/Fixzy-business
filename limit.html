<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152b">
<title>FIXZY BUSINESS | Limit</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#101828;font-family:Arial,sans-serif}
.app{max-width:620px;margin:auto;padding-bottom:35px}
.header{background:#07152b;color:#fff;padding:22px 17px 27px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-left{display:flex;align-items:center;gap:11px}
.logo{width:52px;height:52px;border-radius:15px;background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:20px}.brand p{margin:4px 0 0;color:#aab6c8;font-size:12px}
.logout{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:11px;padding:9px 11px;font-weight:700}
.content{padding:0 15px}
.card{background:#fff;border-radius:21px;margin-top:15px;padding:18px;box-shadow:0 6px 22px #10182810}
.title{font-size:19px;font-weight:900;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#081225,#14233c);color:#fff;border-radius:19px;padding:18px}
.hero small{color:#aab6c8;font-size:11px;font-weight:800}
.hero b{display:block;font-size:29px;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.stat{background:#f8fafc;border:1px solid #eaecf0;border-radius:15px;padding:13px}
.stat small{color:#667085;font-size:11px;font-weight:800}
.stat b{display:block;margin-top:5px;font-size:17px}
.status{display:inline-block;margin-top:11px;border-radius:20px;padding:7px 10px;background:#fff4e5;color:#b54708;font-size:11px;font-weight:900}
.status.ok{background:#ecfdf3;color:#027a48}
.status.no{background:#fef3f2;color:#b42318}
label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}
input{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:13px;font-size:15px;outline:none}
.primary{width:100%;border:0;background:#07152b;color:#fff;border-radius:13px;padding:13px;font-weight:900;margin-top:14px}
.secondary{width:100%;border:1px solid #d0d5dd;background:#fff;color:#101828;border-radius:13px;padding:12px;font-weight:800;margin-top:9px}
.msg{display:none;border-radius:12px;padding:11px;font-size:12px;margin-top:11px}
.msg.show{display:block}.msg.error{background:#fef3f2;color:#b42318}.msg.success{background:#ecfdf3;color:#027a48}
.history{border-top:1px solid #eaecf0;margin-top:14px}
.row{padding:13px 0;border-bottom:1px solid #eaecf0}
.row-top{display:flex;justify-content:space-between;gap:10px}.row b{font-size:15px}.date{font-size:11px;color:#667085;margin-top:4px}
.badge{font-size:10px;font-weight:900;border-radius:20px;padding:6px 8px;height:max-content}
.pending{background:#fff4e5;color:#b54708}.approved{background:#ecfdf3;color:#027a48}.rejected{background:#fef3f2;color:#b42318}
.empty{text-align:center;color:#667085;padding:20px 5px;font-size:12px}
.note{font-size:11px;color:#667085;line-height:1.55;margin-top:10px}
.back{display:block;text-align:center;margin-top:15px;color:#344054;text-decoration:none;font-size:12px}
@media(max-width:390px){.brand h1{font-size:18px}.hero b{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"><img src="logofixzy.png" alt="FIXZY BUSINESS"></div>
      <div><h1>FIXZY BUSINESS</h1><p id="identity">Limit Owner</p></div>
    </div>
    <button class="logout" id="logoutBtn">Keluar</button>
  </div>
</header>

<main class="content">
  <div id="message" class="msg"></div>

  <section class="card">
    <div class="title">Limit Kredit</div>
    <div class="hero">
      <small>LIMIT TERSEDIA</small>
      <b id="available">Rp0</b>
      <span id="status" class="status">BELUM DIAJUKAN</span>
    </div>
    <div class="grid">
      <div class="stat"><small>LIMIT DISETUJUI</small><b id="approved">Rp0</b></div>
      <div class="stat"><small>LIMIT TERPAKAI</small><b id="used">Rp0</b></div>
    </div>
  </section>

  <section class="card" id="applyCard">
    <div class="title">Ajukan Limit</div>
    <label for="amount">Nominal Limit yang Diajukan</label>
    <input id="amount" type="number" min="100000" step="50000" placeholder="Contoh: 5000000">
    <button class="primary" id="submitBtn">Ajukan Limit</button>
    <button class="secondary" id="refreshBtn">↻ Refresh Data</button>
    <div class="note">Pengajuan akan masuk ke Superadmin untuk diperiksa. Limit belum berubah sebelum disetujui.</div>
  </section>

  <section class="card">
    <div class="title">Riwayat Pengajuan</div>
    <div id="history" class="history"><div class="empty">Memuat...</div></div>
  </section>

  <a class="back" href="index.html">← Kembali ke FIXZY BUSINESS</a>
</main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,getDocs,addDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
 authDomain:"teknisi-ponsel-maja.firebaseapp.com",
 projectId:"teknisi-ponsel-maja",
 storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
 messagingSenderId:"835618012205",
 appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);

let currentUser=null;
let currentLimit=null;

function message(text,type="success"){
  $("message").textContent=text;
  $("message").className="msg show "+type;
}

function statusClass(s){
  if(s==="DISETUJUI") return "approved";
  if(s==="DITOLAK") return "rejected";
  return "pending";
}

function renderLimit(x){
  currentLimit=x||{};
  $("approved").textContent=rupiah(x?.limitDisetujui||0);
  $("used").textContent=rupiah(x?.limitTerpakai||0);
  $("available").textContent=rupiah(x?.limitTersedia||0);
  const s=x?.status||"BELUM_DIAJUKAN";
  $("status").textContent=s;
  $("status").className="status "+(s==="DISETUJUI"?"ok":s==="DITOLAK"?"no":"");
}

function dateText(x){
  if(!x) return "-";
  if(x.toDate) return x.toDate().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return "-";
}

async function loadLimit(){
  const ref=doc(db,"limits",currentUser.uid);
  let snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{
      ownerUid:currentUser.uid,
      limitDisetujui:0,
      limitTerpakai:0,
      limitTersedia:0,
      status:"BELUM_DIAJUKAN",
      createdAt:serverTimestamp()
    });
    snap=await getDoc(ref);
  }
  renderLimit(snap.data()||{});
}

async function loadHistory(){
  $("history").innerHTML='<div class="empty">Memuat...</div>';
  try{
    const q=query(
      collection(db,"limitApplications"),
      where("ownerUid","==",currentUser.uid)
    );
    const snap=await getDocs(q);
    const rows=[];
    snap.forEach(d=>rows.push({id:d.id,...d.data()}));
    rows.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));

    if(!rows.length){
      $("history").innerHTML='<div class="empty">Belum ada pengajuan limit.</div>';
      return;
    }

    $("history").innerHTML="";
    rows.forEach(x=>{
      const s=x.status||"MENUNGGU";
      const nominal=x.nominalPengajuan ?? x.nominal ?? x.limitDiminta ?? 0;
      const div=document.createElement("div");
      div.className="row";
      div.innerHTML=`
        <div class="row-top">
          <div>
            <b>${rupiah(nominal)}</b>
            <div class="date">${dateText(x.createdAt)}</div>
          </div>
          <span class="badge ${statusClass(s)}">${s}</span>
        </div>
        ${x.catatan?`<div class="date">Catatan: ${x.catatan}</div>`:""}
      `;
      $("history").appendChild(div);
    });
  }catch(e){
    console.error(e);
    $("history").innerHTML='<div class="empty">Riwayat belum dapat dimuat.</div>';
  }
}

$("submitBtn").onclick=async()=>{
  const nominal=Number($("amount").value);
  if(!nominal || nominal<100000){
    message("Masukkan pengajuan minimal Rp100.000.","error");
    return;
  }

  if(currentLimit?.status==="MENUNGGU"){
    message("Masih ada pengajuan yang sedang menunggu persetujuan.","error");
    return;
  }

  $("submitBtn").disabled=true;
  try{
    await addDoc(collection(db,"limitApplications"),{
      ownerUid:currentUser.uid,
      nominalPengajuan:nominal,
      status:"MENUNGGU",
      createdAt:serverTimestamp()
    });

    // Status pada dokumen limits menandai bahwa Owner sedang mengajukan.
    await setDoc(doc(db,"limits",currentUser.uid),{
      ownerUid:currentUser.uid,
      limitDisetujui:Number(currentLimit?.limitDisetujui)||0,
      limitTerpakai:Number(currentLimit?.limitTerpakai)||0,
      limitTersedia:Number(currentLimit?.limitTersedia)||0,
      status:"MENUNGGU",
      updatedAt:serverTimestamp()
    },{merge:true});

    $("amount").value="";
    message("Pengajuan limit berhasil dikirim ke Superadmin.");
    await loadLimit();
    await loadHistory();
  }catch(e){
    console.error(e);
    message("Pengajuan gagal. Periksa Firestore Rules.","error");
  }finally{
    $("submitBtn").disabled=false;
  }
};

$("refreshBtn").onclick=async()=>{
  await loadLimit();
  await loadHistory();
  message("Data Limit diperbarui.");
};

$("logoutBtn").onclick=async()=>{
  await signOut(auth);
  location.href="index.html";
};

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="index.html";
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    const profile=snap.exists()?snap.data():{};

    if(profile.role!=="owner" || profile.ownerUid!==user.uid){
      $("identity").textContent="Halaman ini khusus Owner";
      $("applyCard").style.display="none";
      message("Akses halaman Limit hanya untuk Owner.","error");
      return;
    }

    currentUser=user;
    $("identity").textContent=profile.namaUsaha || profile.nama || "Limit Owner";
    await loadLimit();
    await loadHistory();
  }catch(e){
    console.error(e);
    message("Gagal membaca data Owner.","error");
  }
});
</script>
</body>
</html>
