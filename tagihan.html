<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tagihan | FIXZY BUSINESS</title>
<style>
:root{--yellow:#ffc107;--black:#111;--bg:#f3f4f6;--white:#fff;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.app{width:100%;max-width:1180px;margin:auto;min-height:100vh;padding-bottom:82px}
.top{background:#111;color:#fff;padding:18px 18px 82px;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--yellow);display:grid;place-items:center;flex:0 0 48px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.2px;color:var(--yellow)}
.brand small{display:block;color:#d1d5db;margin-top:3px;font-size:12px}
.home{color:#fff;text-decoration:none;font-size:23px;padding:6px}
.content{padding:0 clamp(14px,3vw,28px);margin-top:-60px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.hero-title{font-size:13px;color:var(--muted);margin:0}
.hero-total{font-size:29px;font-weight:900;margin:7px 0 4px}
.hero-note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f8f8f8;border-radius:14px;padding:13px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{display:block;margin-top:6px;font-size:18px}
.list{overflow-x:auto;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.recap-table{width:100%;min-width:920px;border-collapse:collapse;font-size:11px}
.recap-table th{background:#111;color:#fff;padding:9px 7px;text-align:left;font-size:10px;white-space:nowrap;border-right:1px solid #374151}
.recap-table td{padding:8px 7px;border-bottom:1px solid #d1d5db;vertical-align:middle;white-space:nowrap}
.recap-table tbody tr:nth-child(even){background:#fafafa}
.recap-table tbody tr:hover{background:#fff8d6}
.recap-table .member{font-weight:700;max-width:150px;white-space:normal}
.invoice-no{font-weight:800}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;white-space:nowrap}
.wait{background:#fef3c7;color:#92400e}
.due{background:#fee2e2;color:#991b1b}
.paid{background:#dcfce7;color:#166534}
.pay-cell{text-align:center}
.btn{border:0;border-radius:8px;padding:7px 11px;font-weight:900;font-size:11px;cursor:pointer;background:#111;color:#fff;white-space:nowrap}
.btn.yellow{background:var(--yellow);color:#111}
.note{font-size:11px;color:var(--muted);line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:25px 10px;font-size:13px}
.loading{text-align:center;padding:25px;color:var(--muted)}
.message{display:none;padding:11px 13px;border-radius:11px;margin-bottom:12px;font-size:12px;font-weight:700}
.message.show{display:block}
.message.errmsg{background:#fee2e2;color:#991b1b}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}
.nav{border:0;background:transparent;color:var(--yellow);font-size:10px;font-weight:800;text-decoration:none;text-align:center;padding:3px}
.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px;color:var(--yellow)}
.nav.active{color:var(--yellow)}
@media(max-width:700px){
  .top{padding:16px 15px 66px}
  .content{margin-top:-42px}
  .summary{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:480px){
  .invoice-head{flex-direction:column}
  .summary{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"><img src="logofixzy.png" alt="FIXZY"></div>
      <div>
        <h1>FIXZY BUSINESS</h1>
        <small>Tagihan Owner</small>
      </div>
    </div>
    <a class="home" href="index.html" title="Dashboard">⌂</a>
  </div>
</header>

<main class="content">
  <section class="card">
    <p class="hero-title">TOTAL TAGIHAN</p>
    <div class="hero-total" id="totalTagihan">Rp0</div>
    <p class="hero-note" id="heroNote">Memuat data tagihan...</p>
  </section>

  <div id="message" class="message"></div>

  <section class="card">
    <div class="summary">
      <div class="stat"><small>Jumlah Tagihan</small><b id="jumlahTagihan">0</b></div>
      <div class="stat"><small>Belum Lunas</small><b id="belumLunas">Rp0</b></div>
      <div class="stat"><small>Jatuh Tempo</small><b id="jatuhTempo">Rp0</b></div>
    </div>
  </section>

  <section class="card">
    <h2 style="font-size:19px;margin:0 0 12px">DAFTAR TAGIHAN</h2>
    <div id="loading" class="loading">Memuat tagihan...</div>
    <div id="invoices" class="list" style="display:none">
      <table class="recap-table">
        <thead>
          <tr>
            <th>NOTA</th>
            <th>OWNER</th>
            <th>JENIS</th>
            <th>STATUS</th>
            <th>JATUH TEMPO</th>
            <th>NILAI BARANG</th>
            <th>SUDAH DIBAYAR</th>
            <th>SISA TAGIHAN</th>
            <th>BAYAR</th>
          </tr>
        </thead>
        <tbody id="invoiceRows"></tbody>
      </table>
    </div>
  </section>
</main>

<nav class="bottom">
  <a class="nav" href="index.html"><i>⌂</i>Beranda</a>
  <a class="nav" href="produk.html"><i>🛒</i>Belanja</a>
  <a class="nav active" href="tagihan.html"><i>🧾</i>Tagihan</a>
  <a class="nav" href="riwayat.html"><i>↔️</i>Riwayat</a>
  <a class="nav" href="profil.html"><i>👤</i>Profil</a>
</nav>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  getDoc,
  doc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
  authDomain:"teknisi-ponsel-maja.firebaseapp.com",
  projectId:"teknisi-ponsel-maja",
  storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
  messagingSenderId:"835618012205",
  appId:"1:835618012205:web:95e41095d1a56c761d4ca4"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let currentOwnerName="";

function money(v){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v)||0);
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function normStatus(v){
  return String(v||"").trim().toUpperCase().replaceAll(" ","_");
}

function dateValue(v){
  if(!v) return null;
  try{
    const d=v?.toDate ? v.toDate() : new Date(v);
    return Number.isNaN(d.getTime()) ? null : d;
  }catch{return null}
}

function dateText(v){
  const d=dateValue(v);
  if(!d) return "-";
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
}

function statusInfo(inv){
  const s=normStatus(inv.status);
  if(s==="JATUH_TEMPO") return {text:"JATUH TEMPO",cls:"due"};
  if(["LUNAS","SUDAH_DIBAYAR","DIBAYAR"].includes(s)) return {text:"LUNAS",cls:"paid"};
  return {text:"BELUM LUNAS",cls:"wait"};
}

function getItems(inv){
  if(Array.isArray(inv.items)) return inv.items;
  return [];
}

function renderInvoice(inv){
  const s=statusInfo(inv);
  const total=Number(inv.total ?? inv.totalTagihan ?? 0);
  const paid=Number(inv.totalTerbayar ?? inv.terbayar ?? 0);
  const remaining=Number(inv.sisaTagihan ?? Math.max(0,total-paid));
  const method=String(inv.metodePembayaran||"LIMIT").toUpperCase();
  const jenis=(method==="LIMIT"||method==="TEMPO"||method.includes("LIMIT"))
    ? "LIMIT" : "SALDO";
  const dueNow=isDueTodayOrPast(inv.jatuhTempo);

  const payCell = remaining > 0
    ? `<button class="btn yellow" data-pay="${esc(inv.id)}">💳 Bayar</button>`
    : `<span class="badge paid">LUNAS</span>`;

  return `<tr>
    <td class="invoice-no">${esc(inv.invoiceNo || inv.nomorInvoice || inv.id)}</td>
    <td class="member">${esc(currentOwnerName || inv.ownerName || inv.namaOwner || "-")}</td>
    <td>${jenis}</td>
    <td><span class="badge ${s.cls}">${s.text}</span></td>
    <td>${dateText(inv.jatuhTempo)}</td>
    <td>${money(total)}</td>
    <td>${money(paid)}</td>
    <td><b>${money(remaining)}</b></td>
    <td class="pay-cell">${payCell}</td>
  </tr>`;
}

function dateKey(v){
  const d=dateValue(v);
  if(!d) return "";
  return new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Jakarta",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(d);
}

function isDueTodayOrPast(v){
  const due=dateKey(v);
  if(!due) return false;
  const today=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Jakarta",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(new Date());
  return due<=today;
}

async function requestPayment(invoiceId){
  try{
    const invSnap=await getDoc(doc(db,"invoices",invoiceId));
    if(!invSnap.exists()) throw new Error("Tagihan tidak ditemukan.");

    const inv={id:invSnap.id,...invSnap.data()};
    const total=Number(inv.total ?? inv.totalTagihan ?? 0);
    const paid=Number(inv.totalTerbayar ?? inv.terbayar ?? 0);
    const remaining=Math.max(0,Number(inv.sisaTagihan ?? Math.max(0,total-paid)));

    if(remaining<=0){
      $("message").textContent="Tagihan ini sudah lunas.";
      $("message").className="message show";
      return;
    }

    const walletSnap=await getDoc(doc(db,"wallets",auth.currentUser.uid));
    const saldo=walletSnap.exists()?Number(walletSnap.data().saldoPribadi||0):0;
    const dueNow=isDueTodayOrPast(inv.jatuhTempo);

    /*
      Aturan pembayaran:
      - Jatuh tempo hari ini / sudah lewat: WAJIB LUNAS FULL.
      - Sebelum jatuh tempo: BOLEH BAYAR SEBAGIAN.
      - Pembayaran selalu memakai SALDO PRIBADI.
      - LIMIT TIDAK BOLEH dipakai membayar tagihan.
      - Tidak ada persetujuan Superadmin.
    */

    if(dueNow && saldo < remaining){
      alert(
        "Tagihan sudah jatuh tempo dan wajib dibayar penuh.\n\n"+
        "Sisa tagihan: "+money(remaining)+"\n"+
        "Saldo pribadi: "+money(saldo)+"\n\n"+
        "Saldo tidak mencukupi. Silakan Top Up terlebih dahulu."
      );
      location.href="topup.html";
      return;
    }

    if(!dueNow && saldo<=0){
      alert(
        "Saldo pribadi belum mencukupi untuk melakukan pembayaran sebagian.\n\n"+
        "Silakan Top Up terlebih dahulu."
      );
      location.href="topup.html";
      return;
    }

    let nominal;

    if(dueNow){
      const ok=confirm(
        "Tagihan sudah jatuh tempo.\n\n"+
        "Pembayaran wajib penuh sebesar "+money(remaining)+".\n\n"+
        "Saldo pribadi: "+money(saldo)+"\n\n"+
        "Lanjut bayar sekarang?"
      );
      if(!ok) return;
      nominal=remaining;
    }else{
      const maxBayar=Math.min(remaining,saldo);
      const raw=prompt(
        "Masukkan nominal pembayaran.\n\n"+
        "Sisa tagihan: "+money(remaining)+"\n"+
        "Saldo pribadi: "+money(saldo)+"\n"+
        "Maksimal pembayaran sekarang: "+money(maxBayar)+"\n\n"+
        "Sebelum jatuh tempo, pembayaran boleh sebagian.",
        String(maxBayar)
      );

      if(raw===null) return;

      nominal=Number(String(raw).replace(/\D/g,""));

      if(!Number.isInteger(nominal)||nominal<=0){
        $("message").textContent="Nominal pembayaran tidak valid.";
        $("message").className="message show errmsg";
        return;
      }

      if(nominal>remaining){
        $("message").textContent="Nominal melebihi sisa tagihan.";
        $("message").className="message show errmsg";
        return;
      }

      if(nominal>saldo){
        $("message").textContent="Nominal melebihi saldo pribadi. Jika ingin membayar lebih, silakan Top Up terlebih dahulu.";
        $("message").className="message show errmsg";
        return;
      }
    }

    /*
      Pembayaran langsung secara transaction:
      wallet saldo pribadi berkurang,
      invoice berkurang,
      dan limit yang sebelumnya terpakai dikembalikan sebesar pembayaran.
      Ketiga perubahan terjadi dalam satu transaksi Firestore.
    */
    await runTransaction(db,async tx=>{
      const invRef=doc(db,"invoices",invoiceId);
      const walletRef=doc(db,"wallets",auth.currentUser.uid);
      const limitRef=doc(db,"limits",auth.currentUser.uid);

      const [freshInvSnap,walletSnap,limitSnap]=await Promise.all([
        tx.get(invRef),
        tx.get(walletRef),
        tx.get(limitRef)
      ]);

      if(!freshInvSnap.exists()) throw new Error("Tagihan tidak ditemukan.");
      if(!walletSnap.exists()) throw new Error("Saldo pribadi Owner tidak ditemukan.");

      const freshInv=freshInvSnap.data();
      const freshTotal=Number(freshInv.total ?? freshInv.totalTagihan ?? 0);
      const freshPaid=Number(freshInv.totalTerbayar ?? freshInv.terbayar ?? 0);
      const freshRemaining=Math.max(
        0,
        Number(freshInv.sisaTagihan ?? Math.max(0,freshTotal-freshPaid))
      );

      if(freshRemaining<=0) throw new Error("Tagihan sudah lunas.");

      const freshDue=isDueTodayOrPast(freshInv.jatuhTempo);
      const wallet=walletSnap.data();
      const freshSaldo=Number(wallet.saldoPribadi||0);

      if(freshSaldo<nominal) throw new Error("Saldo pribadi tidak mencukupi.");

      if(freshDue && nominal!==freshRemaining){
        throw new Error("Tagihan sudah jatuh tempo. Pembayaran wajib penuh.");
      }

      if(!freshDue && nominal>freshRemaining){
        throw new Error("Nominal melebihi sisa tagihan.");
      }

      const newPaid=Math.min(freshTotal,freshPaid+nominal);
      const newRemaining=Math.max(0,freshTotal-newPaid);

      tx.update(walletRef,{
        saldoPribadi:freshSaldo-nominal,
        updatedAt:serverTimestamp()
      });

      /*
        Hanya invoice LIMIT/TEMPO yang mengembalikan limit.
        Invoice tunai/SALDO_PRIBADI tidak menyentuh limit.
      */
      const method=String(
        freshInv.metodePembayaran ??
        freshInv.metode ??
        ""
      ).toUpperCase().trim();

      const isLimitInvoice=[
        "LIMIT",
        "TEMPO",
        "LIMIT / TEMPO",
        "LIMIT/TEMPO"
      ].includes(method);

      if(isLimitInvoice && limitSnap.exists()){
        const limit=limitSnap.data();
        const usedBefore=Math.max(0,Number(limit.limitTerpakai||0));
        const approved=Math.max(0,Number(limit.limitDisetujui||0));
        const availableBefore=Math.max(
          0,
          Number(limit.limitTersedia ?? Math.max(0,approved-usedBefore))
        );

        const returned=Math.min(nominal,usedBefore);
        const usedAfter=Math.max(0,usedBefore-returned);
        const availableAfter=Math.max(
          0,
          Number(limit.limitTersedia ?? availableBefore)+returned
        );

        tx.update(limitRef,{
          limitTerpakai:usedAfter,
          limitTersedia:availableAfter,
          lastPaymentInvoiceId:invoiceId,
          lastPaymentNominal:nominal,
          lastPaymentAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
      }

      tx.update(invRef,{
        totalTerbayar:newPaid,
        sisaTagihan:newRemaining,
        status:newRemaining===0?"LUNAS":"BELUM_LUNAS",
        lastPaymentAt:serverTimestamp(),
        lastPaymentNominal:nominal
      });
    });

    $("message").textContent =
      nominal===remaining
        ? "Pembayaran lunas berhasil. Saldo pribadi sudah dipotong dan limit yang terpakai sudah dikembalikan."
        : "Pembayaran sebagian berhasil. Sisa tagihan tetap tercatat dan limit yang terpakai sudah dikembalikan sesuai pembayaran.";
    $("message").className="message show";
    await loadInvoices(auth.currentUser);

  }catch(err){
    console.error(err);
    $("message").textContent=err.message||"Gagal melakukan pembayaran.";
    $("message").className="message show errmsg";
  }
}

async function loadInvoices(user){
  $("loading").style.display="block";
  $("invoices").style.display="none";
  $("invoiceRows").innerHTML="";

  try{
    const q=query(
      collection(db,"invoices"),
      where("ownerUid","==",user.uid)
    );
    const snap=await getDocs(q);

    let invoices=snap.docs.map(d=>({id:d.id,...d.data()}));

    invoices.sort((a,b)=>{
      const ad=dateValue(a.createdAt)?.getTime() || 0;
      const bd=dateValue(b.createdAt)?.getTime() || 0;
      return bd-ad;
    });

    let total=0;
    let countOpen=0;
    let dueTotal=0;

    invoices.forEach(inv=>{
      const status=normStatus(inv.status);
      const remaining=Number(inv.sisaTagihan ?? inv.totalTagihan ?? inv.total ?? 0);

      if(!["LUNAS","SUDAH_DIBAYAR","DIBAYAR"].includes(status)){
        total+=remaining;
        countOpen++;
      }

      const due=dateValue(inv.jatuhTempo);
      if(due && due.getTime() < Date.now() &&
         !["LUNAS","SUDAH_DIBAYAR","DIBAYAR"].includes(status)){
        dueTotal+=remaining;
      }
    });

    $("totalTagihan").textContent=money(total);
    $("jumlahTagihan").textContent=countOpen;
    $("belumLunas").textContent=money(total);
    $("jatuhTempo").textContent=money(dueTotal);
    $("heroNote").textContent=countOpen
      ? `${countOpen} tagihan masih harus dibayar.`
      : "Belum ada tagihan yang harus dibayar.";

    $("loading").style.display="none";

    if(!invoices.length){
      $("invoices").style.display="block";
      $("invoiceRows").innerHTML='<tr><td colspan="9" class="empty">Belum ada tagihan.</td></tr>';
      return;
    }

    const openInvoices=invoices.filter(inv=>{
      const s=normStatus(inv.status);
      return !["LUNAS","SUDAH_DIBAYAR","DIBAYAR"].includes(s);
    });

    $("invoices").style.display="block";
    $("invoiceRows").innerHTML=openInvoices.length
      ? openInvoices.map(renderInvoice).join("")
      : '<tr><td colspan="9" class="empty">Semua tagihan sudah lunas.</td></tr>';

    document.querySelectorAll("[data-pay]").forEach(btn=>{
      btn.addEventListener("click",()=>requestPayment(btn.dataset.pay));
    });

  }catch(err){
    console.error(err);
    $("loading").style.display="none";
    $("message").textContent="Gagal memuat tagihan: "+(err.message||"Terjadi kesalahan.");
    $("message").className="message show errmsg";
    $("invoices").style.display="none";
    $("invoiceRows").innerHTML="";
  }
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="index.html";
    return;
  }

  try{
    const userSnap=await getDoc(doc(db,"users",user.uid));
    if(!userSnap.exists()){
      alert("Data akun tidak ditemukan.");
      location.href="index.html";
      return;
    }

    const profile=userSnap.data();
    currentOwnerName =
      profile.nama ||
      profile.namaLengkap ||
      profile.name ||
      profile.displayName ||
      user.displayName ||
      profile.email ||
      user.email ||
      "-";
    if(profile.role!=="owner"){
      alert("Halaman ini khusus Owner.");
      location.href="index.html";
      return;
    }

    await loadInvoices(user);
  }catch(err){
    console.error(err);
    alert("Gagal memeriksa akun Owner.");
    location.href="index.html";
  }
});
</script>
