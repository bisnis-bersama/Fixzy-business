<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Data Tagihan | FIXZY BUSINESS</title>
<style>
*{box-sizing:border-box}:root{--y:#FFC107;--b:#111;--bg:#f3f4f6;--m:#6b7280;--bd:#e5e7eb;--g:#16a34a}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:#111;color:#fff;padding:18px 18px 82px;border-radius:0 0 30px 30px}.brand{display:flex;align-items:center;justify-content:space-between}.left{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--y)}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:17px;margin:0;color:var(--y);font-weight:900}.small{display:block;color:#d1d5db;margin-top:3px;font-size:12px}.home{color:#fff;text-decoration:none;font-size:23px}.content{padding:0 15px;margin-top:-60px}.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}.title{font-size:20px;font-weight:900;margin:0}.note{font-size:12px;color:var(--m);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f8f8f8;border-radius:14px;padding:13px}.stat small{display:block;color:var(--m);font-size:11px}.stat b{display:block;margin-top:6px;font-size:18px}.list{display:flex;flex-direction:column;gap:12px}.item{border:1px solid var(--bd);border-radius:16px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.no{font-weight:900}.owner{font-size:11px;color:var(--m);margin-top:4px}.badge{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.info{background:#f8f8f8;border-radius:11px;padding:10px}.info small{display:block;color:var(--m);font-size:10px}.info b{display:block;margin-top:4px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:11px;padding:12px;font-weight:900;cursor:pointer;background:#111;color:#fff}.btn.yellow{background:var(--y);color:#111}.btn.green{background:var(--g);color:#fff}.btn:disabled{opacity:.5}.pending{margin-top:10px;padding:10px;background:#fff7d6;border-radius:11px;font-size:12px}.empty{text-align:center;color:var(--m);padding:25px}.msg{display:none;padding:11px;border-radius:11px;margin-bottom:12px;font-size:12px;font-weight:700}.msg.show{display:block}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{color:var(--y);font-size:10px;font-weight:800;text-decoration:none;text-align:center;padding:3px}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}@media(max-width:600px){.top{padding:16px 15px 66px}.content{margin-top:-42px}.stats{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="left"><div class="logo"><img src="logofixzy.png" alt="FIXZY"></div><div><h1>FIXZY BUSINESS</h1><span class="small">Superadmin · Data Tagihan</span></div></div><a class="home" href="index-superadmin.html">⌂</a></div></header>
<main class="content"><section class="card"><h2 class="title">Data Tagihan</h2><p class="note">Invoice Owner dan permintaan pembayaran yang menunggu verifikasi.</p><div class="stats"><div class="stat"><small>Total Tagihan</small><b id="count">0</b></div><div class="stat"><small>Belum Lunas</small><b id="unpaid">Rp 0</b></div><div class="stat"><small>Jatuh Tempo</small><b id="due">0</b></div></div></section><div id="msg" class="msg"></div><section class="card"><div id="list" class="list"><div class="empty">Memuat...</div></div></section></main>
<nav class="bottom"><a class="nav" href="index-superadmin.html"><i>⌂</i>Beranda</a><a class="nav" href="data-produk.html"><i>▦</i>Produk</a><a class="nav" href="data-pesanan.html"><i>📦</i>Pesanan</a><a class="nav" href="data-tagihan.html"><i>🧾</i>Tagihan</a><a class="nav" href="pengaturan.html"><i>⚙</i>Profil</a></nav></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,getDoc,query,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={
apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",
authDomain:"teknisi-ponsel-maja.firebaseapp.com",
projectId:"teknisi-ponsel-maja",
storageBucket:"teknisi-ponsel-maja.firebasestorage.app",
messagingSenderId:"835618012205",
appId:"1:835618012205:web:95e41095d1a56c761d4ca4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function date(v){try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?"-":d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}catch{return "-"}}
function phone(v){let s=String(v||"").replace(/\D/g,"");return s.startsWith("0")?"62"+s.slice(1):s}
function show(t,ok=false){$("msg").textContent=t;$("msg").className="msg show "+(ok?"ok":"err")}
async function sendWA(inv){
 const u=await getDoc(doc(db,"users",inv.ownerUid));const p=u.exists()?u.data():{};
 const no=p.noWhatsApp||p.whatsapp||p.telepon||p.noHp||p.nomorHp||p.phone||"";
 if(!no)return show("Nomor WhatsApp Owner belum tersimpan.");
 const remain=Number(inv.sisaTagihan??(Number(inv.total||0)-Number(inv.totalTerbayar||0)));
 const text=`Halo ${p.nama||p.namaLengkap||p.namaUsaha||"Owner FIXZY"},

Ini pengingat tagihan FIXZY BUSINESS.

No. Pesanan: ${inv.nomorPesanan||"-"}
Total Tagihan: ${money(inv.total)}
Sudah Dibayar: ${money(inv.totalTerbayar||0)}
Sisa Tagihan: ${money(remain)}
Jatuh Tempo: ${date(inv.jatuhTempo)}

Mohon melakukan pembayaran sebelum atau pada jatuh tempo.

Terima kasih.
FIXZY BUSINESS`;
 window.open("https://wa.me/"+phone(no)+"?text="+encodeURIComponent(text),"_blank");
}
async function approvePayment(id){
 const pSnap=await getDoc(doc(db,"payments",id));if(!pSnap.exists())throw Error("Pembayaran tidak ditemukan.");
 const p=pSnap.data();if(p.status!=="MENUNGGU")throw Error("Pembayaran sudah diproses.");
 await runTransaction(db,async tx=>{
  const invRef=doc(db,"invoices",p.invoiceId),walRef=doc(db,"wallets",p.ownerUid),payRef=doc(db,"payments",id);
  const invSnap=await tx.get(invRef),walSnap=await tx.get(walRef);
  if(!invSnap.exists()||!walSnap.exists())throw Error("Invoice atau saldo Owner tidak ditemukan.");

  const inv=invSnap.data(),wal=walSnap.data();
  const total=Number(inv.total??inv.totalTagihan??0);
  const paid=Number(inv.totalTerbayar??0);
  const remain=Number(inv.sisaTagihan??Math.max(0,total-paid));
  const nom=Number(p.nominal||0);
  const saldo=Number(wal.saldoPribadi||0);

  if(nom<=0||nom>remain)throw Error("Nominal pembayaran tidak valid.");
  if(nom>saldo)throw Error("Saldo Owner tidak mencukupi.");

  const newPaid=paid+nom;
  const newRemain=Math.max(0,total-newPaid);
  const method=String(inv.metodePembayaran||inv.metode||"").toUpperCase();
  const isLimitInvoice=["LIMIT","TEMPO","LIMIT / TEMPO","LIMIT/TEMPO"].includes(method);

  // Pembayaran invoice Limit/Tempo mengembalikan nominal yang dibayar
  // ke Limit Tersedia dengan mengurangi Limit Terpakai.
  let limitUpdate=null;
  if(isLimitInvoice){
   const limRef=doc(db,"limits",p.ownerUid);
   const limSnap=await tx.get(limRef);
   if(!limSnap.exists())throw Error("Data limit Owner tidak ditemukan.");
   const lim=limSnap.data();
   const used=Math.max(0,Number(lim.limitTerpakai||0));
   const available=Math.max(0,Number(lim.limitTersedia||0));
   if(nom>used)throw Error("Nominal pembayaran melebihi limit terpakai.");
   const newUsed=used-nom;
   const newAvailable=available+nom;
   limitUpdate={ref:limRef,used:newUsed,available:newAvailable,oldUsed:used,oldAvailable:available};
  }

  tx.update(walRef,{saldoPribadi:saldo-nom,updatedAt:serverTimestamp()});
  tx.update(invRef,{totalTerbayar:newPaid,sisaTagihan:newRemain,status:newRemain===0?"LUNAS":(inv.status||"BELUM_LUNAS"),lastPaymentAt:serverTimestamp()});
  if(limitUpdate){
   tx.update(limitUpdate.ref,{
    limitTerpakai:limitUpdate.used,
    limitTersedia:limitUpdate.available,
    updatedAt:serverTimestamp()
   });
  }
  tx.update(payRef,{
   status:"DISETUJUI",
   verifiedBy:auth.currentUser.uid,
   verifiedAt:serverTimestamp(),
   saldoSebelum:saldo,
   saldoSesudah:saldo-nom,
   limitDikembalikan:isLimitInvoice?nom:0,
   limitTerpakaiSebelum:isLimitInvoice?limitUpdate.oldUsed:null,
   limitTerpakaiSesudah:isLimitInvoice?limitUpdate.used:null,
   limitTersediaSebelum:isLimitInvoice?limitUpdate.oldAvailable:null,
   limitTersediaSesudah:isLimitInvoice?limitUpdate.available:null
  });
 });
}
async function load(){
 const [isnap,psnap]=await Promise.all([getDocs(collection(db,"invoices")),getDocs(query(collection(db,"payments"),where("status","==","MENUNGGU")))]);
 const invs=isnap.docs.map(d=>({id:d.id,...d.data()})), pays=psnap.docs.map(d=>({id:d.id,...d.data()}));
 let unpaid=0,due=0;invs.forEach(x=>{const s=Number(x.sisaTagihan??(Number(x.total||0)-Number(x.totalTerbayar||0)));if(s>0){unpaid+=s;const d=x.jatuhTempo?.toDate?x.jatuhTempo.toDate():new Date(x.jatuhTempo);if(!isNaN(d)&&d.getTime()<Date.now())due++}});
 $("count").textContent=invs.length;$("unpaid").textContent=money(unpaid);$("due").textContent=due;
 invs.sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));
 $("list").innerHTML=invs.length?invs.map(x=>{
  const s=Number(x.sisaTagihan??(Number(x.total||0)-Number(x.totalTerbayar||0))), pp=pays.filter(p=>p.invoiceId===x.id);
  const pending=pp.map(p=>`<div class="pending"><b>Permintaan bayar ${money(p.nominal)}</b><button class="btn green" style="width:100%;margin-top:8px" data-approve="${p.id}">Setujui Pembayaran</button></div>`).join("");
  return `<article class="item"><div class="head"><div><div class="no">${esc(x.nomorPesanan||x.invoiceNo||x.id)}</div><div class="owner">Owner UID: ${esc(x.ownerUid||"-")}</div></div><span class="badge">${esc(x.status||"BELUM_LUNAS")}</span></div><div class="grid"><div class="info"><small>Total</small><b>${money(x.total)}</b></div><div class="info"><small>Sisa</small><b>${money(s)}</b></div><div class="info"><small>Sudah Dibayar</small><b>${money(x.totalTerbayar||0)}</b></div><div class="info"><small>Jatuh Tempo</small><b>${date(x.jatuhTempo)}</b></div></div><div class="actions"><button class="btn yellow" data-wa="${x.id}">📱 Kirim WA Tagihan</button><button class="btn" data-copy="${x.id}">Salin Info</button></div>${pending}</article>`;
 }).join(""):'<div class="empty">Belum ada tagihan.</div>';
 document.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>sendWA(invs.find(x=>x.id===b.dataset.wa)));
 document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const x=invs.find(x=>x.id===b.dataset.copy),s=Number(x.sisaTagihan??(Number(x.total||0)-Number(x.totalTerbayar||0)));await navigator.clipboard?.writeText(`Tagihan FIXZY BUSINESS\nPesanan: ${x.nomorPesanan||"-"}\nSisa: ${money(s)}\nJatuh Tempo: ${date(x.jatuhTempo)}`);show("Info tagihan disalin.",true)});
 document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{if(!confirm("Setujui pembayaran? Saldo pribadi dipotong dan pembayaran tagihan Limit/Tempo akan mengembalikan limit yang terpakai."))return;try{await approvePayment(b.dataset.approve);show("Pembayaran disetujui. Saldo Owner dan tagihan diperbarui; jika invoice Limit/Tempo, limit terpakai dikembalikan ke limit tersedia.",true);await load()}catch(e){show(e.message||"Gagal memproses pembayaran.")}});
}
onAuthStateChanged(auth,async u=>{if(!u){location.href="index-superadmin.html";return}const me=await getDoc(doc(db,"users",u.uid));if(!me.exists()||me.data().role!=="superadmin"){alert("Akses hanya Superadmin.");location.href="index.html";return}try{await load()}catch(e){console.error(e);show("Gagal memuat data tagihan.")}});
</script></body></html>
