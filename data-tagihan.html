<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Data Tagihan | FIXZY BUSINESS</title>
<style>*{box-sizing:border-box}:root{--y:#FFC107;--b:#111;--bg:#f3f4f6;--m:#6b7280;--bd:#e5e7eb}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:#111;color:#fff;padding:18px 18px 82px;border-radius:0 0 30px 30px}.brand{display:flex;align-items:center;justify-content:space-between}.left{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--y)}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:17px;margin:0;color:var(--y);font-weight:900}.small{display:block;color:#d1d5db;margin-top:3px;font-size:12px}.home{color:#fff;text-decoration:none;font-size:23px}.content{padding:0 15px;margin-top:-60px}.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}.title{font-size:20px;font-weight:900;margin:0}.note{font-size:12px;color:var(--m);margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f8f8f8;border-radius:14px;padding:13px}.stat small{display:block;color:var(--m);font-size:11px}.stat b{display:block;margin-top:6px;font-size:18px}.list{display:flex;flex-direction:column;gap:12px}.item{border:1px solid var(--bd);border-radius:16px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.no{font-weight:900}.owner{font-size:11px;color:var(--m);margin-top:4px}.badge{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e;height:max-content}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.info{background:#f8f8f8;border-radius:11px;padding:10px}.info small{display:block;color:var(--m);font-size:10px}.info b{display:block;margin-top:4px;font-size:13px}.empty{text-align:center;color:var(--m);padding:25px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);background:#111;border-top:1px solid #2b2b2b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:transparent;color:var(--y);font-size:10px;font-weight:800;text-decoration:none;text-align:center;padding:3px}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}@media(max-width:600px){.top{padding:16px 15px 66px}.content{margin-top:-42px}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="left"><div class="logo"><img src="logofixzy.png" alt="FIXZY"></div><div><h1>FIXZY BUSINESS</h1><span class="small">Superadmin · Data Tagihan</span></div></div><a class="home" href="index-superadmin.html">⌂</a></div></header>
<main class="content"><section class="card"><h2 class="title">Data Tagihan</h2><p class="note">Daftar invoice Owner dari transaksi Limit / Tempo.</p><div class="stats"><div class="stat"><small>Total Tagihan</small><b id="count">0</b></div><div class="stat"><small>Belum Lunas</small><b id="unpaid">Rp 0</b></div><div class="stat"><small>Jatuh Tempo</small><b id="due">0</b></div></div></section><section class="card"><div id="list" class="list"><div class="empty">Memuat data tagihan...</div></div></section></main>
<nav class="bottom"><a class="nav" href="index-superadmin.html"><i>⌂</i>Beranda</a><a class="nav" href="data-produk.html"><i>▦</i>Produk</a><a class="nav" href="data-pesanan.html"><i>🛒</i>Pesanan</a><a class="nav" href="data-tagihan.html"><i>🧾</i>Tagihan</a><a class="nav" href="pengaturan.html"><i>⚙</i>Profil</a></nav></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",authDomain:"teknisi-ponsel-maja.firebaseapp.com",projectId:"teknisi-ponsel-maja",storageBucket:"teknisi-ponsel-maja.firebasestorage.app",messagingSenderId:"835618012205",appId:"1:835618012205:web:95e41095d1a56c761d4ca4"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function d(v){try{const x=v?.toDate?v.toDate():new Date(v);return isNaN(x)?null:x}catch{return null}}function dt(v){const x=d(v);return x?x.toLocaleDateString("id-ID",{dateStyle:"medium"}):"-"}
onAuthStateChanged(auth,async u=>{if(!u){location.href="index-superadmin.html";return}try{const me=await getDoc(doc(db,"users",u.uid));if(!me.exists()||me.data().role!=="superadmin"){alert("Akses hanya untuk Superadmin.");location.href="index.html";return}const snap=await getDocs(collection(db,"invoices"));const rows=snap.docs.map(x=>({id:x.id,...x.data()}));let unpaid=0,due=0;rows.forEach(x=>{const s=Number(x.sisaTagihan??(Number(x.total||0)-Number(x.totalTerbayar||0)));unpaid+=Math.max(0,s);const z=d(x.jatuhTempo);if(s>0&&z&&z.getTime()<Date.now())due++});$("count").textContent=rows.length;$("unpaid").textContent=money(unpaid);$("due").textContent=due;rows.sort((a,b)=>(d(b.createdAt)?.getTime()||0)-(d(a.createdAt)?.getTime()||0));$("list").innerHTML=rows.length?rows.map(x=>{const s=Number(x.sisaTagihan??(Number(x.total||0)-Number(x.totalTerbayar||0)));return `<article class="item"><div class="head"><div><div class="no">${esc(x.nomorPesanan||x.id)}</div><div class="owner">Owner: ${esc(x.ownerUid||"-")}</div></div><span class="badge">${esc(x.status||"BELUM_DIBAYAR")}</span></div><div class="grid"><div class="info"><small>Total</small><b>${money(x.total)}</b></div><div class="info"><small>Sisa</small><b>${money(s)}</b></div><div class="info"><small>Tempo</small><b>${Number(x.tempoHari||0)} hari</b></div><div class="info"><small>Jatuh Tempo</small><b>${dt(x.jatuhTempo)}</b></div><div class="info"><small>Dibuat</small><b>${dt(x.createdAt)}</b></div><div class="info"><small>Sudah Dibayar</small><b>${money(x.totalTerbayar)}</b></div></div></article>`}).join(""):'<div class="empty">Belum ada tagihan.</div>'}catch(e){console.error(e);$("list").innerHTML='<div class="empty">Gagal memuat data tagihan.</div>'}});
</script></body></html>
